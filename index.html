/* ============================================================
   DRAFT (commissioner-run snake draft, live board for everyone)
   ============================================================ */
function getDraft(){ return State.config.draft || {status:'none', firstTeam:(State.config.teams[0]||{}).id, captains:{}, picks:[]}; }
function draftPair(d){ const ids=State.config.teams.map(t=>t.id); return d.firstTeam===ids[1]?[ids[1],ids[0]]:[ids[0],ids[1]]; }
function draftPickedIds(d){ return new Set([...Object.values(d.captains||{}), ...d.picks.map(p=>p.playerId)]); }
function draftPool(d){ const picked=draftPickedIds(d); return (State.config.players||[]).filter(p=>!picked.has(p.id)); }
function teamOnClock(d){
  if(!draftPool(d).length) return null;
  const [a,b]=draftPair(d); const i=d.picks.length; const round=Math.floor(i/2);
  const pair=round%2===0?[a,b]:[b,a]; return pair[i%2];
}
function draftComplete(d){ return d.status!=='none' && draftPool(d).length===0; }

async function saveDraft(d){ State.config.draft=d; await saveConfig(); }
async function startDraft(capA, capB, firstTeam){
  const ids=State.config.teams.map(t=>t.id);
  State.config.players.forEach(p=>{ p.teamId=''; p.isCaptain=false; });
  const A=player(capA), B=player(capB);
  if(A){ A.teamId=ids[0]; A.isCaptain=true; }
  if(B){ B.teamId=ids[1]; B.isCaptain=true; }
  await saveDraft({ status:'live', firstTeam, captains:{[ids[0]]:capA,[ids[1]]:capB}, picks:[] });
  renderDraftRunner();
}
async function makePick(pid){
  const d=getDraft(); if(d.status!=='live') return;
  const tm=teamOnClock(d); if(!tm) return;
  const p=player(pid); if(p) p.teamId=tm;
  d.picks.push({playerId:pid, teamId:tm});
  if(draftPool(d).length===0) d.status='done';
  await saveDraft(d); renderDraftRunner();
}
async function undoPick(){
  const d=getDraft(); if(!d.picks.length) return;
  const last=d.picks.pop(); const p=player(last.playerId); if(p) p.teamId='';
  d.status='live'; await saveDraft(d); renderDraftRunner();
}
async function resetDraft(){
  State.config.players.forEach(p=>{ p.teamId=''; p.isCaptain=false; });
  await saveDraft({status:'none', firstTeam:State.config.teams[0].id, captains:{}, picks:[]});
  renderDraftSetup();
}
async function finishDraft(){ const d=getDraft(); if(d.status==='live'&&draftComplete(d)) d.status='done'; await saveDraft(d); closeModal(); go('roster'); }

function draftBoardHTML(d){
  const onClock=teamOnClock(d);
  const col=(t)=>{
    const cap=d.captains?.[t.id];
    const order=[cap, ...d.picks.filter(p=>p.teamId===t.id).map(p=>p.playerId)].filter(Boolean);
    const rows=order.map((pid,idx)=>`<div class="draft-pick"><span class="dp-av">${avatarOf(pid)}</span><span class="dp-nm">${esc(player(pid)?.name||'?')}</span>${idx===0?'<span class="tag">C</span>':`<span class="dp-n">${idx}</span>`}</div>`).join('');
    const clock=onClock===t.id;
    return `<div class="draft-col ${clock?'on':''}" style="--tc:${t.color}"><div class="draft-col-h" style="background:${t.color}">${esc(t.name)}${clock?' · on the clock':''}</div>${rows||'<div class="muted" style="padding:8px">—</div>'}</div>`;
  };
  return `<div class="draft-board">${State.config.teams.map(col).join('')}</div>`;
}

function renderDraftSetup(){
  const d=getDraft();
  const [TA,TB]=State.config.teams;
  const roster=State.config.players||[];
  const opts=(sel)=>['<option value="">— pick —</option>',...roster.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`)].join('');
  showModal(`
    <div class="modal-h" style="display:flex;justify-content:space-between;align-items:center"><h2>Run the Draft</h2><button class="btn sm ghost" onclick="renderAdmin()">Back</button></div>
    <div class="modal-b">
      ${d.status==='live'||d.picks.length?`<div class="banner">A draft is in progress (${d.picks.length} pick${d.picks.length===1?'':'s'}).</div>
        <button class="btn" onclick="renderDraftRunner()">Continue draft</button>
        <button class="btn ghost" style="margin-top:8px;color:var(--red)" onclick="resetDraft()">Reset &amp; start over</button>
        <div class="divider"></div><div class="eyebrow">Or set up fresh</div>`:''}
      <p class="muted" style="margin-bottom:12px">Pick the two captains and who's on the clock first. Everyone else watches the board fill in live on the Roster tab as you make picks.</p>
      <div class="field"><label>${esc(TA.name)} captain</label><select id="capA">${opts(d.captains?.[TA.id])}</select></div>
      <div class="field"><label>${esc(TB.name)} captain</label><select id="capB">${opts(d.captains?.[TB.id])}</select></div>
      <div class="field"><label>First pick</label><select id="firstT">
        <option value="${TA.id}">${esc(TA.name)}</option><option value="${TB.id}">${esc(TB.name)}</option>
      </select></div>
      <button class="btn gold" onclick="doStartDraft()">Start snake draft</button>
      <div id="draftErr" class="muted" style="color:var(--red);text-align:center;margin-top:8px"></div>
    </div>`);
}
function doStartDraft(){
  const a=$('#capA').value, b=$('#capB').value, f=$('#firstT').value;
  if(!a||!b){ $('#draftErr').textContent='Choose both captains.'; return; }
  if(a===b){ $('#draftErr').textContent='Captains must be two different people.'; return; }
  startDraft(a,b,f);
}
function renderDraftRunner(){
  const d=getDraft();
  if(d.status==='none') return renderDraftSetup();
  const onClock=teamOnClock(d), done=draftComplete(d);
  const t=team(onClock);
  const pool=draftPool(d).slice().sort((a,b)=>(hcpOf(a.id)??999)-(hcpOf(b.id)??999));
  const poolBtns=pool.map(p=>`<button class="draft-pickbtn" onclick="makePick('${p.id}')"><span>${avatarOf(p.id)}</span> ${esc(p.name)} <small>${hcpOf(p.id)??'—'}</small></button>`).join('');
  const capName=onClock?(player(d.captains[onClock])?.name?.split(' ')[0]||''):'';
  showModal(`
    <div class="modal-h" style="display:flex;justify-content:space-between;align-items:center"><h2>Draft</h2>
      <div style="display:flex;gap:6px"><button class="btn sm ghost" onclick="confirmResetDraft()">Reset</button><button class="btn sm ghost" onclick="finishDraft()">${done?'Finish':'Close'}</button></div>
    </div>
    <div class="modal-b">
      ${done

function strokeGridRound(){ return State.strokeRound || (State.config.rounds.find(r=>roundLive(r))||State.config.rounds[0])?.id; }
function strokeCellHTML(rid,pid,round,h){
  const ov=getStrokeOverride(rid,pid,h);
  const val = ov!=null ? ov : autoStrokes(pid,round,h);
  const isOv = ov!=null;
  const txt = val>0 ? String(val) : (isOv?'0':'');
  return `<button id="sc-${pid}-${h}" class="gcell scell ${isOv?'ov':''} ${val>0?'has':''} ${isOv&&val===0?'z':''}" onclick="cycleStroke('${rid}','${pid}',${h})">${txt}</button>`;
}
function renderStrokeGrid(rid){
  rid = rid || strokeGridRound();
  State.strokeRound = rid;
  const round=State.config.rounds.find(r=>r.id===rid);
  const c=courseOf(round), pars=c?.pars||[], si=c?.si||[];
  const rounds=State.config.rounds;
  const tabs=`<div class="lb-round-tab">${rounds.map(r=>`<button class="${r.id===rid?'on':''}" onclick="renderStrokeGrid('${r.id}')">${esc(r.name)}</button>`).join('')}</div>`;
  const H=[]; for(let h=1;h<=18;h++) H.push(h);
  const siEditor=`<div class="si-edit">${H.map(h=>`<div class="si-cell"><span class="hh">${h}</span><input type="number" min="1" max="18" value="${si[h-1]??''}" onchange="setCourseSI('${c?.id}',${h},this.value)"/></div>`).join('')}</div>`;
  const headCells=H.map(h=>`<div class="gcell gh">${h}<span>${pars[h-1]||'?'}</span><span class="si">${si[h-1]??'?'}</span></div>`).join('');
  const players=(State.config.players||[]).slice().sort(cmpHcp);
  const rows=players.map(p=>{
    const ch=courseHcpOf(p.id,c);
    const cells=H.map(h=>strokeCellHTML(rid,p.id,round,h)).join('');
    return `<div class="grow"><div class="gname">${esc(displayName(p.id))}<span>${useHcp()?'CH '+ch:'—'}</span></div>${cells}<button class="greset" onclick="resetStrokeRow('${rid}','${p.id}')" title="Reset row to auto">↺</button></div>`;
  }).join('');
  showModal(`
    <div class="modal-h" style="display:flex;justify-content:space-between;align-items:center"><h2>Strokes</h2><button class="btn sm ghost" onclick="renderAdmin()">Done</button></div>
    <div class="modal-b">
      ${tabs}
      <div class="muted" style="margin:-2px 0 8px">${esc(round.name)} · ${esc(c?.name||'Course')} — tap a cell to cycle <b>auto → 0 → 1 → 2 → 3 → auto</b>. Faint = auto from handicap, <b style="color:var(--gold)">gold</b> = your override.</div>
      ${(!useHcp())?`<div class="banner">Handicaps are off — the whole event is gross, so the stroke sheet is ignored right now.</div>`:''}
      <div class="eyebrow">Stroke index · which hole ranks 1 (hardest) – 18</div>
      <div class="gscroll">${siEditor}</div>
      <div class="eyebrow" style="margin-top:14px">Strokes per player</div>
      <div class="gscroll"><div class="ggrid"><div class="grow ghead"><div class="gname">Hole · Par · SI</div>${headCells}<div class="greset"></div></div>${rows}</div></div>
      <div class="muted" style="font-size:11px;margin-top:8px">Dots drive net for singles, better ball, shramble and team total. Scramble &amp; foursomes are team formats (one side handicap), so per-player dots don't change those rounds.</div>
    </div>`);
}
async function cycleStroke(rid,pid,h){
  const ov=getStrokeOverride(rid,pid,h);
  let next; if(ov==null) next=0; else if(ov>=3) next=null; else next=ov+1;
  setStrokeOverrideLocal(rid,pid,h,next);
  const round=State.config.rounds.find(r=>r.id===rid);
  const cell=document.getElementById('sc-'+pid+'-'+h);
  if(cell){ const tmp=document.createElement('div'); tmp.innerHTML=strokeCellHTML(rid,pid,round,h); const nc=tmp.firstElementChild; cell.className=nc.className; cell.textContent=nc.textContent; }
  await saveConfig();
}
function setStrokeOverrideLocal(rid,pid,h,val){
  State.config.strokeOverrides = State.config.strokeOverrides||{};
  const so=State.config.strokeOverrides;
  so[rid]=so[rid]||{}; so[rid][pid]=so[rid][pid]||{};
  if(val==null){ delete so[rid][pid][h]; if(!Object.keys(so[rid][pid]).length) delete so[rid][pid]; }
  else so[rid][pid][h]=val;
}
async function resetStrokeRow(rid,pid){
  if(State.config.strokeOverrides?.[rid]?.[pid]){ delete State.config.strokeOverrides[rid][pid]; await saveConfig(); }
  renderStrokeGrid(rid);
}
async function setCourseSI(cid,h,v){
  const c=course(cid); if(!c) return; c.si=(c.si||[]).slice(); const n=Number(v);
  if(n>=1&&n<=18){ c.si[h-1]=n; await saveConfig(); renderStrokeGrid(State.strokeRound); }
}

async function setCourseTee(cid,name){ const c=course(cid); const t=(c?.tees||[]).find(x=>x.name===name); if(c&&t){ c.tee=name; c.rating=t.rating; c.slope=t.slope; } await saveConfig(); renderAdmin(); }
async function setSegWeight(rid,segId,v){ const {seg}=findSeg(rid,segId); if(seg) seg.weight=(v===''?1:Number(v)); await saveConfig(); }
async function setFrozen(rid,on){ const r=State.config.rounds.find(x=>x.id===rid); if(r) r.frozen=on; await saveConfig(); renderAdmin(); }

/* admin mutations */
async function saveConfig(){ Store.set('config',State.config); }   // fire-and-forget: Store already persists locally + queues for retry before its own network call, so the screen never waits on Netlify to re-render
function setTeamName(id,v){ team(id).name=v; saveConfig(); }
function setTeamColor(id,v){ team(id).color=v; saveConfig(); render(); }
async function setRoundField(rid,field,val){ State.config.rounds.find(r=>r.id===rid)[field]=val; await saveConfig(); renderAdmin(); }
async function setSplit(rid, on){
  const r=State.config.rounds.find(x=>x.id===rid);
  const segs=segsOf(r);
  if(on){
    const frontFmt=segs[0]?.format||'', frontGroups=segs[0]?.groups||[];
    r.split=true;
    r.segments=[
      {id:'f', label:'Front 9', start:1, end:9, format:frontFmt, groups:frontGroups},
      {id:'b', label:'Back 9', start:10, end:18, format:segs[1]?.format||'', groups:segs[1]?.groups||[]},
    ];
  } else {
    r.split=false;
    r.segments=[{id:'f', label:'All 18', start:1, end:18, format:segs[0]?.format||'', groups:segs[0]?.groups||[]}];
  }
  await saveConfig(); renderAdmin();
}
async function setSegFormat(rid, segId, val){
  const r=State.config.rounds.find(x=>x.id===rid);
  const seg=segsOf(r).find(s=>s.id===segId); if(seg){ seg.format=val; if(!seg.matches) seg.matches=[]; }
  await saveConfig(); renderAdmin();
}
function findSeg(rid,segId){ const r=State.config.rounds.find(x=>x.id===rid); return {r, seg: segsOf(r).find(s=>s.id===segId)}; }
function newMatchId(){ return 'm'+Math.random().toString(36).slice(2,8); }
function renderPairings(rid, segId){
  const {r,seg}=findSeg(rid,segId);
  const per=perSideFor(seg.format);
  const [TA,TB]=State.config.teams;
  const aRoster=teamRoster(TA.id), bRoster=teamRoster(TB.id);
  const ms=segMatches(seg);
  const nm=(id)=>player(id)?.name?.split(' ')[0]||'?';
  const matchRows = ms.length ? ms.map(m=>`
    <div class="roster-item">
      <div class="info"><b>${esc(m.a.map(nm).join(' / '))}</b><span>vs ${esc(m.b.map(nm).join(' / '))}</span></div>
      <div style="display:flex;align-items:center;gap:4px"><span style="font-size:10px;color:var(--text-dim)">start</span>
        <input type="number" min="${seg.start}" max="${seg.end}" value="${m.start||seg.start}" onchange="setMatchStart('${rid}','${segId}','${m.id}',this.value)" style="width:46px;padding:6px;border-radius:8px;border:1px solid var(--line);text-align:center"/></div>
      <button class="btn sm ghost" style="color:var(--red)" onclick="removeMatch('${rid}','${segId}','${m.id}')">✕</button>
    </div>`).join('') : '<div class="muted">No matches yet.</div>';
  const opts=(roster)=>roster.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const aSelects=Array.from({length:per},(_,i)=>`<select id="pairA${i}" class="pairsel">${opts(aRoster)}</select>`).join('');
  const bSelects=Array.from({length:per},(_,i)=>`<select id="pairB${i}" class="pairsel">${opts(bRoster)}</select>`).join('');
  const canAuto = aRoster.length>=per && bRoster.length>=per;
  showModal(`
    <div class="modal-h" style="display:flex;justify-content:space-between;align-items:center"><h2>Pairings</h2><button class="btn sm ghost" onclick="renderAdmin()">Done</button></div>
    <div class="modal-b">
      <div class="muted" style="margin-bottom:10px">${esc(r.name)}${r.split?' · '+esc(seg.label):''} · ${FORMATS[seg.format]?.label||'Format TBD'}${fmtInfo(seg.format)} · ${per} per side</div>
      ${(!canAuto)?`<div class="banner">Assign players to both teams first — ${esc(TA.name)} has ${aRoster.length}, ${esc(TB.name)} has ${bRoster.length}.</div>`:''}
      <div class="eyebrow">Matches</div>
      <div style="margin-bottom:10px">${matchRows}</div>
      ${canAuto?`<button class="btn ghost sm" style="width:100%;margin-bottom:6px" onclick="autoPair('${rid}','${segId}')">Auto-pair by roster order</button>
      <button class="btn ghost sm" style="width:100%;margin-bottom:12px;color:var(--red)" onclick="clearMatches('${rid}','${segId}')">Clear all matches</button>
      <div class="divider"></div>
      <div class="eyebrow">Add a match manually</div>
      <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">
        <div style="flex:1">${aSelects}</div>
        <div style="font-weight:700;color:var(--text-dim);padding-top:8px">vs</div>
        <div style="flex:1">${bSelects}</div>
      </div>
      <button class="btn gold sm" style="width:100%" onclick="addMatch('${rid}','${segId}',${per})">Add match</button>`:''}
    </div>`);
}
async function autoPair(rid,segId){
  const {seg}=findSeg(rid,segId); const per=perSideFor(seg.format);
  const a=teamRoster(State.config.teams[0].id).map(p=>p.id);
  const b=teamRoster(State.config.teams[1].id).map(p=>p.id);
  const n=Math.min(Math.floor(a.length/per),Math.floor(b.length/per));
  const matches=[];
  for(let k=0;k<n;k++){ matches.push({id:newMatchId(), a:a.slice(k*per,k*per+per), b:b.slice(k*per,k*per+per)}); }
  seg.matches=matches; await saveConfig(); renderPairings(rid,segId);
}
async function addMatch(rid,segId,per){
  const {seg}=findSeg(rid,segId);
  const a=[],b=[];
  for(let i=0;i<per;i++){ const av=$('#pairA'+i).value, bv=$('#pairB'+i).value; if(av) a.push(av); if(bv) b.push(bv); }
  if(!a.length||!b.length) return;
  seg.matches=seg.matches||[]; seg.matches.push({id:newMatchId(), a, b});
  await saveConfig(); renderPairings(rid,segId);
}
async function removeMatch(rid,segId,mid){ const {seg}=findSeg(rid,segId); seg.matches=(seg.matches||[]).filter(m=>m.id!==mid); await saveConfig(); renderPairings(rid,segId); }
async function setMatchStart(rid,segId,mid,v){ const {seg}=findSeg(rid,segId); const m=(seg.matches||[]).find(x=>x.id===mid); if(m) m.start=(v===''?undefined:Number(v)); await saveConfig(); renderPairings(rid,segId); }
async function clearMatches(rid,segId){ const {seg}=findSeg(rid,segId); seg.matches=[]; await saveConfig(); renderPairings(rid,segId); }

function editPlayer(pid){
  const p=pid?player(pid):{id:'',name:'',teamId:'',isCaptain:false};
  const curIdx=pid?hcpOf(pid):null;
  showModal(`<div class="modal-h"><h2>${pid?'Edit player':'Add player'}</h2></div>
    <div class="modal-b">
      <div class="field"><label>Name</label><input id="pName" value="${esc(p.name)}"/></div>
      <div class="two">
        <div class="field"><label>Handicap index</label><input id="pHcp" type="number" step="0.1" inputmode="decimal" value="${curIdx!=null?curIdx:''}"/></div>
        <div class="field"><label>Team</label><select id="pTeam">
          <option value="">— none —</option>
          ${State.config.teams.map(t=>`<option value="${t.id}" ${p.teamId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}
        </select></div>
      </div>
      <label style="display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;margin:4px 0 14px">
        <input id="pCap" type="checkbox" ${p.isCaptain?'checked':''} style="width:20px;height:20px"/> Team captain
      </label>
      <button class="btn gold" onclick="savePlayer('${pid}')">Save</button>
      ${pid?`<button class="btn ghost" style="margin-top:8px;color:var(--red)" onclick="delPlayer('${pid}')">Delete player</button>`:''}
      <button class="btn ghost" style="margin-top:8px" onclick="renderAdmin()">Back</button>
    </div>`);
}
async function savePlayer(pid){
  const name=$('#pName').value.trim(); if(!name) return;
  const raw=$('#pHcp').value;
  const rec={ name, teamId:$('#pTeam').value, isCaptain:$('#pCap').checked };
  if(pid){ Object.assign(player(pid),rec); }
  else { rec.id='p'+Date.now().toString(36); rec.avatar=''; State.config.players.push(rec); pid=rec.id; }
  // Handicap index lives in its own blob (shared source of truth for self-serve + admin) — sync in the background
  if(raw===''){ delete State.hcps[pid]; Store.del('hcp:'+pid); }
  else { const index=Number(raw); State.hcps[pid]=index; Store.set('hcp:'+pid,{index}); }
  saveConfig(); renderAdmin();
}
async function delPlayer(pid){ State.config.players=State.config.players.filter(p=>p.id!==pid); saveConfig(); renderAdmin(); }

async function seedSample(){
  // (Re)load the real trip roster from the itinerary, keeping any team/hcp/captain
  // edits already made to matching names so this is safe to re-run.
  const existing=Object.fromEntries((State.config.players||[]).map(p=>[p.name,p]));
  State.config.players=TRIP_ROSTER.map((name,i)=>{
    const e=existing[name]||{};
    return { id:e.id||('p'+i), name, hcp:e.hcp??null, teamId:e.teamId||'', isCaptain:e.isCaptain||false, avatar:e.avatar||'' };
  });
  await saveConfig(); renderAdmin();
}
async function addCourse(){
  const name=$('#newCourse').value.trim(); if(!name) return;
  State.config.courses.push({id:'c'+Date.now().toString(36), name, pars:Array.from({length:holeCount()},()=>4)});
  await saveConfig(); renderAdmin();
}
async function delCourse(id){ State.config.courses=State.config.courses.filter(c=>c.id!==id); await saveConfig(); renderAdmin(); }
async function resetScores(){
  const keys=Object.keys(State.cards);
  for(const k of keys){ await Store.del(k); }
  State.cards={}; renderAdmin(); 
}

/* ---------- Demo preview (device-only, never saved) ---------- */
function demoScore(par){ const d=[-1,0,0,0,1,1,2][Math.floor(Math.random()*7)]; return Math.max(1,(par||4)+d); }
function demoFillCard(key, seg, pars, partial){
  const end = partial ? seg.start + Math.floor((seg.end-seg.start)/2) : seg.end;
  const holes={}; for(let h=seg.start; h<=end; h++){ holes[h]=demoScore(pars[h-1]); }
  State.cards[key]={holes, enteredBy:'Demo', updatedAt:Date.now()};
}
function autoPairInMemory(seg){
  const per=perSideFor(seg.format);
  const a=teamRoster(State.config.teams[0].id).map(p=>p.id);
  const b=teamRoster(State.config.teams[1].id).map(p=>p.id);
  const n=Math.min(Math.floor(a.length/per),Math.floor(b.length/per));
  const matches=[]; for(let k=0;k<n;k++){ matches.push({id:'dm'+k+Math.random().toString(36).slice(2,5), a:a.slice(k*per,k*per+per), b:b.slice(k*per,k*per+per)}); }
  seg.matches=matches;
}
function loadDemo(){
  const cfg=State.config, ids=cfg.teams.map(t=>t.id);
  // in-memory: assign any unassigned players to teams, ensure a captain each
  cfg.players.forEach((p,i)=>{ if(!p.teamId) p.teamId=ids[i%2]; });
  ids.forEach(tid=>{ const roster=cfg.players.filter(p=>p.teamId===tid); if(roster.length && !roster.some(p=>p.isCaptain)) roster[0].isCaptain=true; });
  cfg.rounds.forEach(r=>{
    const c=courseOf(r), pars=c?.pars||[];
    segsOf(r).forEach(seg=>{
      if(!seg.format) return;
      if(FORMATS[seg.format]?.scoring==='aggregate'){
        cfg.players.forEach(p=>demoFillCard(cardKey(r.id,seg.id,p.id), seg, pars, false));
      } else {
        if(!segMatches(seg).length) autoPairInMemory(seg);
        const isGroup=FORMATS[seg.format]?.side==='group';
        segMatches(seg).forEach((m,mi)=>{
          const partial = mi===0;   // leave the first match in progress to show a live status
          if(isGroup){ demoFillCard(cardKey(r.id,seg.id,m.id+':a'),seg,pars,partial); demoFillCard(cardKey(r.id,seg.id,m.id+':b'),seg,pars,partial); }
          else { [...m.a,...m.b].forEach(pid=>demoFillCard(cardKey(r.id,seg.id,pid),seg,pars,partial)); }
        });
      }
    });
  });
  State.demo=true;
  document.getElementById('demoBar')?.classList.remove('hidden');
  closeModal(); go('board');
}
async function clearDemo(){
  State.demo=false;
  document.getElementById('demoBar')?.classList.add('hidden');
  recentLocalWrite.clear();   // demo-time edits shouldn't linger and shadow real data on the next poll
  await loadAll();   // reload the real config + scores from the store, discarding the in-memory demo
  render(true);
}

/* ============================================================
   BOOT
   ============================================================ */
(async function boot(){
  Store.onStatus(()=>{ updateSyncDot(); if(State.view==='enter') updateSyncNote(); });
  await loadAll();
  updateMeChip();
  render(true);
  updateSyncDot();
  Store.flush();          // push anything left queued from a previous session
  startPoll();
})();
</script>
