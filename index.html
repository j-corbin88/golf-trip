function viewEnter(){
  if(!State.me) return `<div class="card"><div class="empty"><div class="big">👋</div><b>Sign in first</b><p class="muted" style="margin-top:6px">Tap your name up top so we know whose scores you're entering.</p><button class="btn gold" style="margin-top:14px" onclick="openIdentity()">Pick my name</button></div></div>`;
  const rounds=State.config.rounds.filter(r=>roundLive(r));
  if(!rounds.length) return `<div class="card"><div class="empty"><div class="big">🗓️</div><b>No round is live</b><p class="muted" style="margin-top:6px">The admin hasn't set a format for a day yet.</p></div></div>`;

  if(!State.activeRound || !rounds.find(r=>r.id===State.activeRound)) State.activeRound=rounds[0].id;
  const round=rounds.find(r=>r.id===State.activeRound);
  const roundTabsTop=`<div class="lb-round-tab">${rounds.map(r=>`<button class="${State.activeRound===r.id?'on':''}" onclick="setEnterRound('${r.id}')">${esc(r.name)}${r.frozen?' 🔒':''}</button>`).join('')}</div>`;
  if(round.frozen){
    return `${roundTabsTop}<div class="card"><div class="empty"><div class="big">🔒</div><b>${esc(round.name)} is locked</b><p class="muted" style="margin-top:6px">Scores for this round have been frozen by the admin. Check the leaderboard for results.</p></div></div>`;
  }
  const segs=liveSegs(round);
  if(!State.entrySeg || !segs.find(s=>s.id===State.entrySeg)) State.entrySeg=segs[0].id;
  const seg=segs.find(s=>s.id===State.entrySeg);

  const editable=editableSidesForSeg(round,seg);
  const roundTabs=roundTabsTop;
  const segTabs=(segs.length>1)?`<div class="lb-round-tab" style="margin-top:-6px">${segs.map(s=>`<button class="${s.id===State.entrySeg?'on':''}" onclick="setEnterSeg('${s.id}')">${esc(s.label)} · ${FORMATS[s.format]?.label||''}${fmtInfo(s.format)}</button>`).join('')}</div>`:'';
  const c=courseOf(round), pars=c?.pars||[];

  if(!editable.length) return `${roundTabs}${segTabs}<div class="card"><div class="empty"><div class="big">🔒</div><b>Nothing to enter here</b><p class="muted" style="margin-top:6px">You're not in a group for this segment. Your captain can enter for the team, or ask the admin to add you to a group.</p></div></div>`;

  if(!State.entrySide || !editable.find(s=>s.id===State.entrySide)){ State.entrySide=editable[0].id; State.entryHole=startHoleForSide(seg,State.entrySide); }
  // clamp the current hole into this segment's range (default to this side's start hole)
  if(State.entryHole<seg.start || State.entryHole>seg.end) State.entryHole=startHoleForSide(seg,State.entrySide);
  const side=editable.find(s=>s.id===State.entrySide);
  const card=State.cards[cardKey(round.id,seg.id,side.id)]||{holes:{}};

  const sideTabs=`<div class="side-tabs">${editable.map(s=>`<button class="${s.id===State.entrySide?'on':''}" onclick="setSide('${s.id}')"><span class="av">${sideAvatar(s)}</span>${esc(sideLabel(s))}</button>`).join('')}</div>`;

  const isIndiv = side.kind==='player';
  const si = c?.si||[];

  const segHoleCount=seg.end-seg.start+1;
  const holes=[]; for(let h=seg.start; h<=seg.end; h++) holes.push(h);
  const progression = personalMatchStatus(round, seg, side.id) ? matchProgressionForSide(round, seg, side.id) : null;
  const partners = partnerSideIds(seg, side.id);   // teammates sharing this match side (better ball/shramble/Team Total), else null

  const scoreCell = (h,pid)=>{
    const c2 = pid===side.id ? card : (State.cards[cardKey(round.id,seg.id,pid)]||{holes:{}});
    const v=c2.holes?.[h];
    const net=v!=null?entryNetForHole(round,seg,pid,h,v):null;
    const showNet = v!=null && useHcp() && net!==v;
    return `<button id="hole-${h}-${pid}" class="sc-box sc-score ${(h===State.entryHole&&pid===State.entrySide)?'on':''} ${v!=null?'done':''}" onclick="selectCell(${h},'${pid}')">${v??''}${showNet?`<sup>${net}</sup>`:''}</button>`;
  };

  let tableHTML;
  if(partners){
    const lbl=(t)=>`<div class="sc-plabel">${esc(t)}</div>`;
    const rowHole = lbl('')+holes.map(h=>`<div class="sc-h ${h===State.entryHole?'on':''}">${h}</div>`).join('');
    const rowPar = lbl('Par')+holes.map(h=>`<div class="sc-box sc-par">${pars[h-1]||'—'}</div>`).join('');
    const playerRows = partners.map(pid=>lbl(displayName(pid))+holes.map(h=>scoreCell(h,pid)).join('')).join('');
    const rowMatch = progression ? lbl('')+holes.map(h=>{ const {text,cls}=matchCellLabel(progression[h]); return `<div class="sc-box sc-match ${cls}">${text}</div>`; }).join('') : '';
    tableHTML = `<div class="sc-scroll">
      <div class="sc-table" style="grid-template-columns:62px repeat(${holes.length},44px)">
        ${rowHole}${rowPar}${playerRows}<div id="matchRow" style="display:contents">${rowMatch}</div>
      </div>
      </div>
      <div class="muted" style="font-size:11px;margin:-6px 2px 12px">Tap either partner's box below to enter for them — no need to switch tabs.</div>`;
  } else {
    const rowHole = holes.map(h=>`<div class="sc-h ${h===State.entryHole?'on':''}">${h}</div>`).join('');
    const rowPar = holes.map(h=>{
      const sN=entryStrokesForHole(round,seg,side.id,h);
      return `<div class="sc-box sc-par">${pars[h-1]||'—'}${sN>0?`<sup>${sN}</sup>`:''}</div>`;
    }).join('');
    const rowScore = holes.map(h=>scoreCell(h,side.id)).join('');
    const rowMatch = progression ? holes.map(h=>{ const {text,cls}=matchCellLabel(progression[h]); return `<div class="sc-box sc-match ${cls}">${text}</div>`; }).join('') : '';
    tableHTML = `<div class="sc-scroll">
      <div class="sc-table" style="grid-template-columns:repeat(${holes.length},44px)">
        ${rowHole}${rowPar}${rowScore}<div id="matchRow" style="display:contents">${rowMatch}</div>
      </div>
      </div>`;
  }

  const cur=card.holes?.[State.entryHole];
  const par=pars[State.entryHole-1]||4;
  const g=grossTotal(card), thru=holesPlayed(card);
  const enteredBy=card.enteredBy?`Last saved by ${esc(card.enteredBy)}`:'Not started';
  const strokeLine = strokeLineHTML(round, seg, side.id, State.entryHole, isIndiv);

  return `
  ${roundTabs}
  ${segTabs}
  <div class="muted" style="margin:-4px 2px 12px">${FORMATS[seg.format]?.label||'Format TBD'}${fmtInfo(seg.format)} · ${esc(c?.name||'Course TBD')} · ${esc(round.dateLabel)}${round.split?' · '+esc(seg.label):''}</div>
  ${sideTabs}
  ${strokeLine}
  <div class="card">
    <div class="mono" id="entryTotal" style="text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:10px">${entryTotalHTML(card,round,seg,side.id)}</div>
    ${tableHTML}
    <div class="stepper">
      <button class="pm" id="minus">–</button>
      <div class="val" id="strokeVal">${cur??par}<small>Strokes · Hole ${State.entryHole}</small></div>
      <button class="pm" id="plus">+</button>
    </div>
    <div class="quickrow">
      <button onclick="prevHole()">‹ Back</button>
      <button onclick="setStroke(${par})">Par</button>
      <button onclick="clearHole()">Clear</button>
      <button onclick="nextHole()">Next ›</button>
    </div>
    <div class="entered-by" id="enteredBy">${enteredBy}</div>
    <div id="syncNote" style="display:none;text-align:center;font-size:11px;color:#9a7a10;margin-top:6px"></div>
  </div>
  `;
}
function entryTotalHTML(card, round, seg, sideId){
  const g=grossTotal(card)||0, thru=holesPlayed(card), segN=seg.end-seg.start+1;
  const isIndiv = !String(sideId).includes(':') && !!player(sideId);
  let net='';
  if(isIndiv && useHcp()){
    let ps=0; Object.keys(card.holes||{}).forEach(h=>{ if(card.holes[h]!=null) ps+=strokeSheet(sideId, round, Number(h)); });
    net=` · <span style="color:var(--gold)">Net ${g-ps}</span>`;
  }
  return `Total ${g}${net} <span style="color:var(--text-dim);font-weight:500">(${thru}/${segN})</span>`;
}
function setEnterRound(id){ State.activeRound=id; State.entrySeg=null; State.entrySide=null; render(false); }
function setEnterSeg(id){ State.entrySeg=id; State.entrySide=null; render(false); }
function setSide(id){ State.entrySide=id; const r=curEntryRefs(); if(r.seg) State.entryHole=startHoleForSide(r.seg,id); render(false); }
function setHole(h){ State.entryHole=h; render(false); }
function nextHole(){
  const round=State.config.rounds.find(r=>r.id===State.activeRound);
  const seg=liveSegs(round).find(s=>s.id===State.entrySeg);
  if(!seg) return;
  State.entryHole = State.entryHole>=seg.end ? seg.start : State.entryHole+1;  // wrap last → first
  render(false);
}
function prevHole(){
  const round=State.config.rounds.find(r=>r.id===State.activeRound);
  const seg=liveSegs(round).find(s=>s.id===State.entrySeg);
  if(!seg) return;
  State.entryHole = State.entryHole<=seg.start ? seg.end : State.entryHole-1;  // wrap first → last
  render(false);
}

function curEntryRefs(){
  const round=State.config.rounds.find(r=>r.id===State.activeRound);
  const seg=liveSegs(round).find(s=>s.id===State.entrySeg) || segsOf(round)[0];
  return {round, seg, key:cardKey(round.id,seg.id,State.entrySide)};
}
function strokeLineHTML(round, seg, pid, hole, isIndiv){
  if(!isIndiv || !useHcp()) return '';
  let segStrokes=0; for(let h=seg.start; h<=seg.end; h++) segStrokes+=entryStrokesForHole(round,seg,pid,h);
  const strokeThisHole=entryStrokesForHole(round,seg,pid,hole);
  return `<div class="muted" id="strokeLine" style="margin:-4px 2px 10px;font-size:12px">You get <b style="color:var(--gold)">${segStrokes}</b> stroke${segStrokes===1?'':'s'} ${round.split?'this nine':'this round'} · <b style="color:var(--gold)">•</b> marks a stroke hole${strokeThisHole?` · you get <b style="color:var(--gold)">${strokeThisHole>1?strokeThisHole+' strokes':'a stroke'}</b> on hole ${hole}`:''}</div>`;
}
function selectCell(hole, pid){
  const prevSide=State.entrySide, prevHole=State.entryHole;
  State.entrySide=pid; State.entryHole=hole;
  const oldBtn=document.getElementById('hole-'+prevHole+'-'+prevSide);
  if(oldBtn) oldBtn.classList.remove('on');
  const newBtn=document.getElementById('hole-'+hole+'-'+pid);
  if(newBtn) newBtn.classList.add('on');
  if(prevHole!==hole){
    document.querySelectorAll('.sc-h').forEach(el=>el.classList.remove('on'));
    const {seg}=curEntryRefs(); const idx=hole-seg.start;
    const holeCells=document.querySelectorAll('.sc-h');
    if(holeCells[idx]) holeCells[idx].classList.add('on');
  }
  const {round,seg,key}=curEntryRefs();
  const card=State.cards[key]||{holes:{}};
  const par=(courseOf(round)?.pars?.[hole-1])||4;
  const valEl=document.getElementById('strokeVal');
  if(valEl) valEl.innerHTML=`${card.holes?.[hole] ?? par}<small>Strokes · Hole ${hole}</small>`;
  const tot=document.getElementById('entryTotal');
  if(tot) tot.innerHTML=entryTotalHTML(card, round, seg, pid);
  const sl=document.getElementById('strokeLine');
  const editable=editableSidesForSeg(round,seg);
  const side=editable.find(s=>s.id===pid);
  if(sl) sl.outerHTML=strokeLineHTML(round, seg, pid, hole, side?.kind==='player');
}
function wireEntry(){
  const {round,seg}=curEntryRefs();
  const c=courseOf(round); const par=(c?.pars?.[State.entryHole-1])||4;
  const plus=$('#plus'), minus=$('#minus');
  const curVal=()=>{ const {key}=curEntryRefs(); return State.cards[key]?.holes?.[State.entryHole]; };
  if(plus) plus.onclick=()=>{ const v=Math.min(15,(curVal()??par)+1); saveHole(v); };
  if(minus) minus.onclick=()=>{ const v=Math.max(1,(curVal()??par)-1); saveHole(v); };
  window.setStroke=(v)=>{ saveHole(v); };
  window.clearHole=()=>{ saveHole(null); };
  const selCell=document.getElementById('hole-'+State.entryHole+'-'+State.entrySide);
  if(selCell && typeof selCell.scrollIntoView==='function') selCell.scrollIntoView({inline:'center', block:'nearest'});
}
const recentLocalWrite=new Map();   // storage key -> timestamp until which local data should win over a poll fetch
async function saveHole(v){
  const {round,key}=curEntryRefs();
  if(round?.frozen) return; // locked
  const card=State.cards[key] || {holes:{}, enteredBy:'', updatedAt:0};
  if(!card.holes) card.holes={};
  if(v==null) delete card.holes[State.entryHole]; else card.holes[State.entryHole]=v;
  card.enteredBy=player(State.me)?.name||'—';
  card.updatedAt=Date.now();
  State.cards[key]=card;
  recentLocalWrite.set(key, Date.now()+20000);   // protect this key's local data for 20s — covers any sync lag without permanently ignoring other devices' updates
  if(State.view==='enter') updateEntryAfterSave(card);   // paint the row/total instantly
  Store.set(key,card);   // fires immediately — Store's own outbox protects this from a same-moment poll; syncs to Netlify in the background
}
function paintScoreCell(round, seg, sideId, hole){
  const btn=document.getElementById('hole-'+hole+'-'+sideId); if(!btn) return;
  const v=State.cards[cardKey(round.id,seg.id,sideId)]?.holes?.[hole];
  btn.classList.toggle('on', hole===State.entryHole && sideId===State.entrySide);
  btn.classList.toggle('done', v!=null);
  if(v==null){ btn.innerHTML=''; return; }
  const net=entryNetForHole(round,seg,sideId,hole,v);
  const showNet = useHcp() && net!==v;
  btn.innerHTML=`${v}${showNet?`<sup>${net}</sup>`:''}`;
}
function paintMatchRow(round, seg, sideId){
  const row=document.getElementById('matchRow'); if(!row) return;
  const prog=personalMatchStatus(round, seg, sideId) ? matchProgressionForSide(round, seg, sideId) : null;
  if(!prog){ row.innerHTML=''; return; }
  let html=''; for(let h=seg.start; h<=seg.end; h++){ const {text,cls}=matchCellLabel(prog[h]); html+=`<div class="sc-box sc-match ${cls}">${text}</div>`; }
  row.innerHTML=html;
}
function updateEntryAfterSave(card){
  const {round,seg}=curEntryRefs();
  const valEl=document.getElementById('strokeVal');
  if(valEl){ const par=courseOf(round)?.pars?.[State.entryHole-1]||4; valEl.innerHTML=`${card.holes?.[State.entryHole] ?? par}<small>Strokes · Hole ${State.entryHole}</small>`; }
  const partners=partnerSideIds(seg, State.entrySide);
  if(partners){ partners.forEach(pid=>paintScoreCell(round, seg, pid, State.entryHole)); }
  else { paintScoreCell(round, seg, State.entrySide, State.entryHole); }
  paintMatchRow(round, seg, State.entrySide);
  const tot=document.getElementById('entryTotal');
  if(tot) tot.innerHTML=entryTotalHTML(card, round, seg, State.entrySide);
  const eb=document.getElementById('enteredBy');
  if(eb) eb.textContent=card.enteredBy?`Last saved by ${card.enteredBy}`:'Not started';
  updateSyncNote();
}

/* ============================================================
   CAPTAIN VOTE (everyone votes; each sees only their own vote;
   full breakdown is admin-only and can seed the draft)
   ============================================================ */
function myVotes(){ return (State.me && State.votes[State.me]) ? State.votes[State.me] : []; }
function voteTally(){ const t={}; Object.values(State.votes).forEach(arr=>{ (arr||[]).forEach(c=>{ if(c) t[c]=(t[c]||0)+1; }); }); return t; }
function voteTopN(n){ return Object.entries(voteTally()).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id])=>id); }
function voteCount(){ return Object.keys(State.votes).filter(k=>(State.votes[k]||[]).length>0).length; }
function toggleVote(choiceId){
  if(!State.me || State.config.settings.voteFrozen) return;
  let cur=(State.votes[State.me]||[]).slice();
  if(cur.includes(choiceId)) cur=cur.filter(x=>x!==choiceId);
  else { if(cur.length>=2) return; cur.push(choiceId); }
  State.votes[State.me]=cur;
  updateVoteRows();   // mutate the existing buttons in place — don't tear down/rebuild the DOM the finger just tapped
  Store.set('vote:'+State.me,{choices:cur, at:Date.now()});   // syncs in the background; queues + retries if offline
}
function voteRowInner(p, on){
  return `<span class="vbox ${on?'on':''}">${on?'✓':''}</span>
    <span style="width:26px;height:26px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:15px;flex:none">${avatarOf(p.id)}</span>
    <span style="flex:1">${esc(p.name)}</span>`;
}
function updateVoteRows(){
  const mine=myVotes();
  const eyebrow=document.getElementById('voteCountEyebrow');
  if(eyebrow) eyebrow.textContent=`${mine.length} of 2 selected${mine.length===2?' ✓':''}`;
  (State.config.players||[]).forEach(p=>{
    const el=document.getElementById('vrow-'+p.id);
    if(!el) return;
    const on=mine.includes(p.id);
    const atCap=!on && mine.length>=2;
    el.disabled=atCap;
    el.className='voterow'+(on?' on':'');
    el.innerHTML=voteRowInner(p,on);
  });
  const done=document.getElementById('voteDoneBtn');
  if(done) done.className='btn '+(mine.length?'gold':'ghost');
}
function renderVoteModal(){
  if(!State.me){ openIdentity(); return; }
  if(State.config.settings.voteFrozen){
    showModal(`<div class="modal-h"><h2>Voting is closed</h2><p class="muted" style="margin:4px 0 0">The commissioner has locked the captain vote.</p></div>
      <div class="modal-b"><button class="btn ghost" onclick="closeModal()">Got it</button></div>`);
    return;
  }
  const mine=myVotes();
  const rows=(State.config.players||[]).map(p=>{
    const on=mine.includes(p.id);
    const atCap = !on && mine.length>=2;
    return `<button id="vrow-${p.id}" onclick="toggleVote('${p.id}')" ${atCap?'disabled':''} class="voterow${on?' on':''}">${voteRowInner(p,on)}</button>`;
  }).join('');
  showModal(`<div class="modal-h"><h2>Vote for two captains</h2><p class="muted" style="margin:4px 0 0">Pick <b>two</b>. Your votes are private — only the commissioner sees the tally. Tap again to unpick; change anytime.</p></div>

/* ============================================================
   DRAFT (commissioner-run snake draft, live board for everyone)
   ============================================================ */
function getDraft(){ return State.config.draft || {status:'none', firstTeam:(State.config.teams[0]||{}).id, captains:{}, picks:[]}; }
function draftPair(d){ const ids=State.config.teams.map(t=>t.id); return d.firstTeam===ids[1]?[ids[1],ids[0]]:[ids[0],ids[1]]; }
function draftPickedIds(d){ return new Set([...Object.values(d.captains||{}), ...d.picks.map(p=>p.playerId)]); }
function draftPool(d){ const picked=draftPickedIds(d); return (State.config.players||[]).filter(p=>!picked.has(p.id)); }
function teamOnClock(d){
  if(!draftPool(d).length) return null;
  const [a,b]=draftPair(d); const i=d.picks.length; const round=Math.floor(i/2);
  const pair=round%2===0?[a,b]:[b,a]; return pair[i%2];
}
function draftComplete(d){ return d.status!=='none' && draftPool(d).length===0; }

async function saveDraft(d){ State.config.draft=d; await saveConfig(); }
async function startDraft(capA, capB, firstTeam){
  const ids=State.config.teams.map(t=>t.id);
  State.config.players.forEach(p=>{ p.teamId=''; p.isCaptain=false; });
  const A=player(capA), B=player(capB);
  if(A){ A.teamId=ids[0]; A.isCaptain=true; }
  if(B){ B.teamId=ids[1]; B.isCaptain=true; }
  await saveDraft({ status:'live', firstTeam, captains:{[ids[0]]:capA,[ids[1]]:capB}, picks:[] });
  renderDraftRunner();
}
async function makePick(pid){
  const d=getDraft(); if(d.status!=='live') return;
  const tm=teamOnClock(d); if(!tm) return;
  const p=player(pid); if(p) p.teamId=tm;
  d.picks.push({playerId:pid, teamId:tm});
  if(draftPool(d).length===0) d.status='done';
  await saveDraft(d); renderDraftRunner();
}
async function undoPick(){
  const d=getDraft(); if(!d.picks.length) return;
  const last=d.picks.pop(); const p=player(last.playerId); if(p) p.teamId='';
  d.status='live'; await saveDraft(d); renderDraftRunner();
}
async function resetDraft(){
  State.config.players.forEach(p=>{ p.teamId=''; p.isCaptain=false; });
  await saveDraft({status:'none', firstTeam:State.config.teams[0].id, captains:{}, picks:[]});
  renderDraftSetup();
}
async function finishDraft(){ const d=getDraft(); if(d.status==='live'&&draftComplete(d)) d.status='done'; await saveDraft(d); closeModal(); go('roster'); }

function draftBoardHTML(d){
  const onClock=teamOnClock(d);
  const col=(t)=>{
    const cap=d.captains?.[t.id];
    const order=[cap, ...d.picks.filter(p=>p.teamId===t.id).map(p=>p.playerId)].filter(Boolean);
    const rows=order.map((pid,idx)=>`<div class="draft-pick"><span class="dp-av">${avatarOf(pid)}</span><span class="dp-nm">${esc(player(pid)?.name||'?')}</span>${idx===0?'<span class="tag">C</span>':`<span class="dp-n">${idx}</span>`}</div>`).join('');
    const clock=onClock===t.id;
    return `<div class="draft-col ${clock?'on':''}" style="--tc:${t.color}"><div class="draft-col-h" style="background:${t.color}">${esc(t.name)}${clock?' · on the clock':''}</div>${rows||'<div class="muted" style="padding:8px">—</div>'}</div>`;
  };
  return `<div class="draft-board">${State.config.teams.map(col).join('')}</div>`;
}

function renderDraftSetup(){
  const d=getDraft();
  const [TA,TB]=State.config.teams;
  const roster=State.config.players||[];
  const opts=(sel)=>['<option value="">— pick —</option>',...roster.map(p=>`<option value="${p.id}" ${sel===p.id?'selected':''}>${esc(p.name)}</option>`)].join('');
  showModal(`

    <div class="modal-b">
      ${d.status==='live'||d.picks.length?`<div class="banner">A draft is in progress (${d.picks.length} pick${d.picks.length===1?'':'s'}).</div>
        <button class="btn" onclick="renderDraftRunner()">Continue draft</button>
        <button class="btn ghost" style="margin-top:8px;color:var(--red)" onclick="resetDraft()">Reset &amp; start over</button>
        <div class="divider"></div><div class="eyebrow">Or set up fresh</div>`:''}
      <p class="muted" style="margin-bottom:12px">Pick the two captains and who's on the clock first. Everyone else watches the board fill in live on the Roster tab as you make picks.</p>
      <div class="field"><label>${esc(TA.name)} captain</label><select id="capA">${opts(d.captains?.[TA.id])}</select></div>
      <div class="field"><label>${esc(TB.name)} captain</label><select id="capB">${opts(d.captains?.[TB.id])}</select></div>
      <div class="field"><label>First pick</label><select id="firstT">

function doStartDraft(){
  const a=$('#capA').value, b=$('#capB').value, f=$('#firstT').value;

}
function renderDraftRunner(){
  const d=getDraft();
  if(d.status==='none') return renderDraftSetup();
  const onClock=teamOnClock(d), done=draftComplete(d);
  const t=team(onClock);
  const pool=draftPool(d).slice().sort((a,b)=>(hcpOf(a.id)??999)-(hcpOf(b.id)??999));
  const poolBtns=pool.map(p=>`<button class="draft-pickbtn" onclick="makePick('${p.id}')"><span>${avatarOf(p.id)}</span> ${esc(p.name)} <small>${hcpOf(p.id)??'—'}</small></button>`).join('');

  showModal(`

    </div>
    <div class="modal-b">
      ${done
        ? `<div class="onclock-card"><div class="eyebrow" style="color:var(--gold)">Draft complete</div><b style="font-size:20px">Teams are set 🏆</b></div>`
        : `<div class="onclock-card" style="border:2px solid ${t?.color}"><div class="eyebrow" style="color:${t?.color}">On the clock · pick ${d.picks.length+1}</div><b style="font-size:22px">${esc(t?.name||'')}</b><div class="muted">${capName?esc(capName)+' picking':''}</div></div>
           <div class="eyebrow">Available (${pool.length})</div><div class="draft-pool">${poolBtns}</div>`}
      ${d.picks.length?`<button class="btn ghost sm" style="margin:10px 0" onclick="undoPick()">↩ Undo last pick (${esc(player(d.picks[d.picks.length-1].playerId)?.name?.split(' ')[0]||'')})</button>`:''}
      <div class="divider"></div>

   STROKE SHEET EDITOR (stroke index + per-player overrides)
   ============================================================ */
function strokeGridRound(){ return State.strokeRound || (State.config.rounds.find(r=>roundLive(r))||State.config.rounds[0])?.id; }
function strokeCellHTML(rid,pid,round,h){
  const ov=getStrokeOverride(rid,pid,h);
  const val = ov!=null ? ov : autoStrokes(pid,round,h);
  const isOv = ov!=null;
  const txt = val>0 ? String(val) : (isOv?'0':'');
  return `<button id="sc-${pid}-${h}" class="gcell scell ${isOv?'ov':''} ${val>0?'has':''} ${isOv&&val===0?'z':''}" onclick="cycleStroke('${rid}','${pid}',${h})">${txt}</button>`;
}
function renderStrokeGrid(rid){
  rid = rid || strokeGridRound();
  State.strokeRound = rid;
  const round=State.config.rounds.find(r=>r.id===rid);
  const c=courseOf(round), pars=c?.pars||[], si=c?.si||[];
  const rounds=State.config.rounds;
  const tabs=`<div class="lb-round-tab">${rounds.map(r=>`<button class="${r.id===rid?'on':''}" onclick="renderStrokeGrid('${r.id}')">${esc(r.name)}</button>`).join('')}</div>`;
  const H=[]; for(let h=1;h<=18;h++) H.push(h);
  const siEditor=`<div class="si-edit">${H.map(h=>`<div class="si-cell"><span class="hh">${h}</span><input type="number" min="1" max="18" value="${si[h-1]??''}" onchange="setCourseSI('${c?.id}',${h},this.value)"/></div>`).join('')}</div>`;
  const headCells=H.map(h=>`<div class="gcell gh">${h}<span>${pars[h-1]||'?'}</span><span class="si">${si[h-1]??'?'}</span></div>`).join('');
  const players=(State.config.players||[]).slice().sort(cmpHcp);
  const rows=players.map(p=>{
    const ch=courseHcpOf(p.id,c);
    const cells=H.map(h=>strokeCellHTML(rid,p.id,round,h)).join('');
    return `<div class="grow"><div class="gname">${esc(displayName(p.id))}<span>${useHcp()?'CH '+ch:'—'}</span></div>${cells}<button class="greset" onclick="resetStrokeRow('${rid}','${p.id}')" title="Reset row to auto">↺</button></div>`;
  }).join('');
  showModal(`
    <div class="modal-h" style="display:flex;justify-content:space-between;align-items:center"><h2>Strokes</h2><button class="btn sm ghost" onclick="renderAdmin()">Done</button></div>
    <div class="modal-b">
      ${tabs}
      <div class="muted" style="margin:-2px 0 8px">${esc(round.name)} · ${esc(c?.name||'Course')} — tap a cell to cycle <b>auto → 0 → 1 → 2 → 3 → auto</b>. Faint = auto from handicap, <b style="color:var(--gold)">gold</b> = your override.</div>
      ${(!useHcp())?`<div class="banner">Handicaps are off — the whole event is gross, so the stroke sheet is ignored right now.</div>`:''}
      <div class="eyebrow">Stroke index · which hole ranks 1 (hardest) – 18</div>
      <div class="gscroll">${siEditor}</div>
      <div class="eyebrow" style="margin-top:14px">Strokes per player</div>
      <div class="gscroll"><div class="ggrid"><div class="grow ghead"><div class="gname">Hole · Par · SI</div>${headCells}<div class="greset"></div></div>${rows}</div></div>
      <div class="muted" style="font-size:11px;margin-top:8px">Dots drive net for singles, better ball, shramble and team total. Scramble &amp; foursomes are team formats (one side handicap), so per-player dots don't change those rounds.</div>
    </div>`);
}
async function cycleStroke(rid,pid,h){
  const ov=getStrokeOverride(rid,pid,h);
  let next; if(ov==null) next=0; else if(ov>=3) next=null; else next=ov+1;
  setStrokeOverrideLocal(rid,pid,h,next);
  const round=State.config.rounds.find(r=>r.id===rid);
  const cell=document.getElementById('sc-'+pid+'-'+h);
  if(cell){ const tmp=document.createElement('div'); tmp.innerHTML=strokeCellHTML(rid,pid,round,h); const nc=tmp.firstElementChild; cell.className=nc.className; cell.textContent=nc.textContent; }
  await saveConfig();
}
function setStrokeOverrideLocal(rid,pid,h,val){
  State.config.strokeOverrides = State.config.strokeOverrides||{};
  const so=State.config.strokeOverrides;
  so[rid]=so[rid]||{}; so[rid][pid]=so[rid][pid]||{};
  if(val==null){ delete so[rid][pid][h]; if(!Object.keys(so[rid][pid]).length) delete so[rid][pid]; }
  else so[rid][pid][h]=val;
}
async function resetStrokeRow(rid,pid){
  if(State.config.strokeOverrides?.[rid]?.[pid]){ delete State.config.strokeOverrides[rid][pid]; await saveConfig(); }
  renderStrokeGrid(rid);
}
async function setCourseSI(cid,h,v){
  const c=course(cid); if(!c) return; c.si=(c.si||[]).slice(); const n=Number(v);
  if(n>=1&&n<=18){ c.si[h-1]=n; await saveConfig(); renderStrokeGrid(State.strokeRound); }
}

async function setSplit(rid, on){
  const r=State.config.rounds.find(x=>x.id===rid);
  const segs=segsOf(r);

    const frontFmt=segs[0]?.format||'', frontGroups=segs[0]?.groups||[];

async function setSegFormat(rid, segId, val){

function findSeg(rid,segId){ const r=State.config.rounds.find(x=>x.id===rid); return {r, seg: segsOf(r).find(s=>s.id===segId)}; }
function newMatchId(){ return 'm'+Math.random().toString(36).slice(2,8); }
function renderPairings(rid, segId){
  const {r,seg}=findSeg(rid,segId);
  const per=perSideFor(seg.format);
  const [TA,TB]=State.config.teams;
  const aRoster=teamRoster(TA.id), bRoster=teamRoster(TB.id);
  const ms=segMatches(seg);
  const nm=(id)=>player(id)?.name?.split(' ')[0]||'?';
  const matchRows = ms.length ? ms.map(m=>`
    <div class="roster-item">
      <div class="info"><b>${esc(m.a.map(nm).join(' / '))}</b><span>vs ${esc(m.b.map(nm).join(' / '))}</span></div>

  const bSelects=Array.from({length:per},(_,i)=>`<select id="pairB${i}" class="pairsel">${opts(bRoster)}</select>`).join('');
  const canAuto = aRoster.length>=per && bRoster.length>=per;
  showModal(`
    <div class="modal-h" style="display:flex;justify-content:space-between;align-items:center"><h2>Pairings</h2><button class="btn sm ghost" onclick="renderAdmin()">Done</button></div>
    <div class="modal-b">
      <div class="muted" style="margin-bottom:10px">${esc(r.name)}${r.split?' · '+esc(seg.label):''} · ${FORMATS[seg.format]?.label||'Format TBD'}${fmtInfo(seg.format)} · ${per} per side</div>
      ${(!canAuto)?`<div class="banner">Assign players to both teams first — ${esc(TA.name)} has ${aRoster.length}, ${esc(TB.name)} has ${bRoster.length}.</div>`:''}
      <div class="eyebrow">Matches</div>
      <div style="margin-bottom:10px">${matchRows}</div>
      ${canAuto?`<button class="btn ghost sm" style="width:100%;margin-bottom:6px" onclick="autoPair('${rid}','${segId}')">Auto-pair by roster order</button>
      <button class="btn ghost sm" style="width:100%;margin-bottom:12px;color:var(--red)" onclick="clearMatches('${rid}','${segId}')">Clear all matches</button>

      <div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:8px">
        <div style="flex:1">${aSelects}</div>
        <div style="font-weight:700;color:var(--text-dim);padding-top:8px">vs</div>
        <div style="flex:1">${bSelects}</div>
      </div>
      <button class="btn gold sm" style="width:100%" onclick="addMatch('${rid}','${segId}',${per})">Add match</button>`:''}
    </div>`);
}
async function autoPair(rid,segId){
  const {seg}=findSeg(rid,segId); const per=perSideFor(seg.format);
  const a=teamRoster(State.config.teams[0].id).map(p=>p.id);
  const b=teamRoster(State.config.teams[1].id).map(p=>p.id);
  const n=Math.min(Math.floor(a.length/per),Math.floor(b.length/per));
  const matches=[];
  for(let k=0;k<n;k++){ matches.push({id:newMatchId(), a:a.slice(k*per,k*per+per), b:b.slice(k*per,k*per+per)}); }
  seg.matches=matches; await saveConfig(); renderPairings(rid,segId);
}
async function addMatch(rid,segId,per){
  const {seg}=findSeg(rid,segId);
  const a=[],b=[];
  for(let i=0;i<per;i++){ const av=$('#pairA'+i).value, bv=$('#pairB'+i).value; if(av) a.push(av); if(bv) b.push(bv); }
  if(!a.length||!b.length) return;
  seg.matches=seg.matches||[]; seg.matches.push({id:newMatchId(), a, b});
  await saveConfig(); renderPairings(rid,segId);
}
async function removeMatch(rid,segId,mid){ const {seg}=findSeg(rid,segId); seg.matches=(seg.matches||[]).filter(m=>m.id!==mid); await saveConfig(); renderPairings(rid,segId); }
async function setMatchStart(rid,segId,mid,v){ const {seg}=findSeg(rid,segId); const m=(seg.matches||[]).find(x=>x.id===mid); if(m) m.start=(v===''?undefined:Number(v)); await saveConfig(); renderPairings(rid,segId); }
async function clearMatches(rid,segId){ const {seg}=findSeg(rid,segId); seg.matches=[]; await saveConfig(); renderPairings(rid,segId); }

async function savePlayer(pid){
  const name=$('#pName').value.trim(); if(!name) return;
  const raw=$('#pHcp').value;
  const v=validateHcp(raw);
  if(!v.ok){ alert(v.msg); return; }
  const rec={ name, teamId:$('#pTeam').value, isCaptain:$('#pCap').checked };
  if(pid){ Object.assign(player(pid),rec); }
  else { rec.id='p'+Date.now().toString(36); rec.avatar=''; State.config.players.push(rec); pid=rec.id; }
  // Handicap index lives in its own blob (shared source of truth for self-serve + admin) — sync in the background
  if(v.value==null){ delete State.hcps[pid]; Store.del('hcp:'+pid); }
  else { State.hcps[pid]=v.value; Store.set('hcp:'+pid,{index:v.value}); }
  saveConfig(); renderAdmin();

/* ---------- Demo preview (device-only, never saved) ---------- */
function demoScore(par){ const d=[-1,0,0,0,1,1,2][Math.floor(Math.random()*7)]; return Math.max(1,(par||4)+d); }
function demoFillCard(key, seg, pars, partial){
  const end = partial ? seg.start + Math.floor((seg.end-seg.start)/2) : seg.end;
  const holes={}; for(let h=seg.start; h<=end; h++){ holes[h]=demoScore(pars[h-1]); }
  State.cards[key]={holes, enteredBy:'Demo', updatedAt:Date.now()};
}
function autoPairInMemory(seg){
  const per=perSideFor(seg.format);
  const a=teamRoster(State.config.teams[0].id).map(p=>p.id);
  const b=teamRoster(State.config.teams[1].id).map(p=>p.id);
  const n=Math.min(Math.floor(a.length/per),Math.floor(b.length/per));
  const matches=[]; for(let k=0;k<n;k++){ matches.push({id:'dm'+k+Math.random().toString(36).slice(2,5), a:a.slice(k*per,k*per+per), b:b.slice(k*per,k*per+per)}); }
  seg.matches=matches;
}
function loadDemo(){
  const cfg=State.config, ids=cfg.teams.map(t=>t.id);
  // in-memory: assign any unassigned players to teams, ensure a captain each
  cfg.players.forEach((p,i)=>{ if(!p.teamId) p.teamId=ids[i%2]; });
  ids.forEach(tid=>{ const roster=cfg.players.filter(p=>p.teamId===tid); if(roster.length && !roster.some(p=>p.isCaptain)) roster[0].isCaptain=true; });
  cfg.rounds.forEach(r=>{
    const c=courseOf(r), pars=c?.pars||[];
    segsOf(r).forEach(seg=>{
      if(!seg.format) return;
      if(FORMATS[seg.format]?.scoring==='aggregate'){
        cfg.players.forEach(p=>demoFillCard(cardKey(r.id,seg.id,p.id), seg, pars, false));
      } else {
        if(!segMatches(seg).length) autoPairInMemory(seg);
        const isGroup=FORMATS[seg.format]?.side==='group';
        segMatches(seg).forEach((m,mi)=>{
          const partial = mi===0;   // leave the first match in progress to show a live status
          if(isGroup){ demoFillCard(cardKey(r.id,seg.id,m.id+':a'),seg,pars,partial); demoFillCard(cardKey(r.id,seg.id,m.id+':b'),seg,pars,partial); }
          else { [...m.a,...m.b].forEach(pid=>demoFillCard(cardKey(r.id,seg.id,pid),seg,pars,partial)); }
        });
      }
    });
  });
  State.demo=true;
  document.getElementById('demoBar')?.classList.remove('hidden');
  closeModal(); go('board');
}
async function clearDemo(){
  State.demo=false;
  document.getElementById('demoBar')?.classList.add('hidden');
  recentLocalWrite.clear();   // demo-time edits shouldn't linger and shadow real data on the next poll
  await loadAll();   // reload the real config + scores from the store, discarding the in-memory demo
  render(true);
}

requestAnimationFrame(()=>{ const sl=document.getElementById('splashLogo'); if(sl) sl.style.opacity='1'; });

(async function boot(){
  const splashStart = Date.now();
  Store.onStatus(()=>{ updateSyncDot(); if(State.view==='enter') updateSyncNote(); });
  await loadAll();
  updateMeChip();
  render(true);
  updateSyncDot();
  Store.flush();          // push anything left queued from a previous session
  startPoll();
  if(State.me && player(State.me) && !State.pins[State.me]){ renderPinSetupOffer(State.me); }   // already signed in from before PINs existed — lock it now
  const minShow=1600, elapsed=Date.now()-splashStart;
  setTimeout(()=>{
    const s=document.getElementById('splash');
    if(s){ s.style.opacity='0'; setTimeout(()=>s.remove(), 550); }
  }, Math.max(0, minShow-elapsed));
})();
</script>
</body>
</html>
