<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>The Cup · Myrtle Beach 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
:root{
  --ink:#0E2A24;          /* clubhouse dark */
  --ink2:#123a31;
  --paper:#F5EFE1;        /* scorecard cream */
  --paper2:#ECE3CF;
  --line:#d8cdb0;
  --text:#1A2B26;
  --text-dim:#5c6b62;
  --light:#EDE7D6;
  --gold:#E5A823;
  --blue:#1E5FA8;
  --green:#2E7D53;
  --red:#C0472B;
  --shadow:0 6px 20px rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--ink);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(72px + env(safe-area-inset-bottom));
}
h1,h2,h3,.disp{font-family:'Oswald',sans-serif;letter-spacing:.01em;margin:0}
.mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.hidden{display:none !important}

/* ---- App header ---- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--ink);
  color:var(--light);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.08);
}
.brand{display:flex;align-items:center;gap:10px}
.brand .flag{font-size:20px}
.brand h1{font-size:19px;font-weight:700;text-transform:uppercase;line-height:1}
.brand small{display:block;font-family:'Inter';font-weight:500;font-size:10px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-top:3px}
.me-chip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.08);padding:5px 9px 5px 6px;border-radius:999px;font-size:12px;font-weight:600;color:var(--light)}
.me-chip .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:15px;background:var(--paper)}

/* ---- Layout ---- */
.screen{max-width:640px;margin:0 auto;padding:16px 14px 24px;min-height:60vh}
.view.anim{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'Oswald';text-transform:uppercase;letter-spacing:.16em;font-size:11px;color:var(--gold);font-weight:600;margin-bottom:8px}
.card{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.card.tight{padding:12px}
.muted{color:var(--text-dim);font-size:13px;line-height:1.5}
.pill{display:inline-block;font-family:'Oswald';font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;font-weight:600}

/* ---- Tug of war meter (signature) ---- */
.cup{background:var(--ink2);border-radius:16px;padding:18px 16px 16px;color:var(--light);box-shadow:var(--shadow);margin-bottom:16px}
.cup-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
.cup-team{display:flex;flex-direction:column;gap:2px}
.cup-team.right{align-items:flex-end;text-align:right}
.cup-team .nm{font-family:'Oswald';font-weight:600;text-transform:uppercase;font-size:14px;letter-spacing:.03em}
.cup-team .pts{font-family:'Oswald';font-weight:700;font-size:40px;line-height:.9}
.cup-team .sub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(237,231,214,.55)}
.meter{height:16px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;overflow:hidden;display:flex}
.meter .fillL,.meter .fillR{height:100%;transition:width .6s cubic-bezier(.2,.7,.3,1)}
.meter .mid{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:rgba(255,255,255,.6);transform:translateX(-1px)}
.cup-foot{text-align:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin-top:11px;color:rgba(237,231,214,.6)}

/* ---- Leaderboard rows ---- */
.lb-round-tab{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.lb-round-tab button{white-space:nowrap;background:rgba(255,255,255,.06);color:var(--light);border:1px solid rgba(255,255,255,.1);padding:8px 13px;border-radius:999px;font-size:12px;font-weight:600}
.lb-round-tab button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.modal-b .lb-round-tab button{background:rgba(0,0,0,.05);color:var(--text);border-color:var(--line)}
.modal-b .lb-round-tab button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.row{display:flex;align-items:center;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .av{width:34px;height:34px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:19px;flex:none;border:2px solid transparent}
.row .nm{flex:1;min-width:0}
.row .nm b{font-weight:600;font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:11px;color:var(--text-dim)}
.row .sc{font-family:'Oswald';font-weight:700;font-size:22px;min-width:44px;text-align:right}
.row .rel{font-family:'Roboto Mono';font-weight:700;font-size:13px;min-width:38px;text-align:right}
.rel.under{color:var(--green)}.rel.over{color:var(--red)}.rel.even{color:var(--text-dim)}
.teamdot{width:8px;height:8px;border-radius:50%;flex:none}

/* ---- Scorecard entry ---- */
.side-tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.side-tabs button{display:flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);padding:7px 11px 7px 7px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text)}
.side-tabs button .av{width:24px;height:24px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:14px}
.side-tabs button.on{background:var(--ink);color:var(--light);border-color:var(--ink)}

.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0 16px}
.stepper .val{font-family:'Oswald';font-weight:700;font-size:64px;line-height:1;min-width:96px;text-align:center}
.stepper .val small{display:block;font-family:'Inter';font-weight:600;font-size:12px;color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase}
.stepper button.pm{width:60px;height:60px;border-radius:50%;background:var(--ink);color:var(--light);font-size:30px;font-weight:600;display:grid;place-items:center}
.stepper button.pm:active{transform:scale(.94)}
.sc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px 14px;padding:0 16px}
.sc-table{display:grid;gap:4px;width:max-content}
.sc-h{text-align:center;font-family:'Oswald';font-weight:600;font-size:13px;color:var(--text-dim);padding:2px 0}
.sc-plabel{display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--text-dim);padding-right:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-h.on{color:var(--text);font-weight:800}
.sc-box{aspect-ratio:1;border-radius:8px;background:var(--paper2);border:1px solid var(--line);font-family:'Oswald';font-weight:700;font-size:15px;color:var(--text);display:flex;align-items:center;justify-content:center;position:relative}
.sc-box sup{font-size:9px;color:var(--red);font-weight:800;margin-left:1px;top:-.6em}
.sc-par sup{color:var(--red)}
.sc-score{background:var(--paper)}
.sc-score.done{background:#dfe6dc}
.sc-score.on{background:var(--ink);color:var(--light);border-color:var(--ink)}
.sc-score.on sup{color:#ffb020}
.sc-score sup{color:var(--gold);font-weight:700}
.sc-match{font-size:10.5px;font-weight:800;letter-spacing:.02em;background:var(--paper)}
.sc-match.win{background:#dff3df;color:#1f6b23}
.sc-match.lose{background:#f7e3e1;color:#a23a30}
.sc-match.as{background:#fbf0d6;color:#8a6a10}
.quickrow{display:flex;gap:8px;margin-bottom:6px}
.quickrow button{flex:1;padding:11px;border-radius:10px;background:var(--paper2);font-weight:600;font-size:13px;border:1px solid var(--line)}
.entered-by{text-align:center;font-size:11px;color:var(--text-dim);margin-top:10px}

/* ---- Generic buttons/forms ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--light);padding:13px 18px;border-radius:11px;font-weight:600;font-size:15px;width:100%}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:9px}
.btn:active{transform:scale(.98)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---- Bottom nav ---- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--ink);border-top:1px solid rgba(255,255,255,.08);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:rgba(237,231,214,.5);font-size:10px;font-weight:600;letter-spacing:.03em;padding:4px 0}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--gold)}

/* ---- Modal ---- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,20,17,.72);display:grid;place-items:center;padding:18px;animation:fade .2s}
.modal{background:var(--paper);border-radius:18px;width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:var(--shadow)}
.modal-h{padding:18px 18px 6px}
.modal-h h2{font-size:22px;text-transform:uppercase;font-weight:700}
.modal-b{padding:6px 18px 18px}
.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:6px 0 4px}
.gallery button{aspect-ratio:1;border-radius:12px;background:var(--paper2);font-size:24px;display:grid;place-items:center;border:2px solid transparent}
.gallery button.on{border-color:var(--ink);background:#fff}
.gallery button:disabled{opacity:.28;cursor:not-allowed}
.namelist{display:grid;gap:7px;margin:4px 0}
.namelist button{display:flex;align-items:center;gap:9px;padding:11px;border-radius:10px;background:#fff;border:1px solid var(--line);text-align:left;font-weight:600}
.namelist button .teamdot{width:9px;height:9px}
.roster-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.roster-item .av{width:30px;height:30px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:17px}
.roster-item .info{flex:1;min-width:0}
.roster-item .info b{font-size:14px}
.roster-item .info span{font-size:11px;color:var(--text-dim);display:block}
.roster-item .hcp{margin-left:auto;text-align:center;font-family:'Oswald';line-height:1;min-width:40px}
.roster-item .hcp b{font-size:19px;font-weight:700;display:block;color:var(--text)}
.roster-item .hcp span{font-size:9px;letter-spacing:.12em;color:var(--text-dim)}
.tag{font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--ink);color:var(--light)}
.vbox{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}
.vbox.on{background:var(--gold);border-color:var(--gold)}
.voterow{display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;background:#fff;color:var(--text);border:1px solid var(--line);text-align:left;font-weight:600;width:100%;margin-bottom:7px}
.voterow.on{background:var(--paper2);border-color:var(--gold)}
.voterow:disabled{opacity:.4}
.empty{text-align:center;padding:28px 16px;color:var(--text-dim)}
.empty .big{font-size:34px;margin-bottom:8px}
.banner{background:rgba(229,168,35,.14);border:1px solid rgba(229,168,35,.4);color:#7a5a10;border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.5;margin-bottom:14px}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.divider{height:1px;background:var(--line);margin:14px 0}
.fmt-blurb{font-size:12px;color:var(--text-dim);line-height:1.5;margin-top:6px}
.match{display:flex;align-items:center;gap:6px;padding:7px 4px}
.matchwrap{border-bottom:1px solid var(--line)}
.matchwrap:last-of-type{border-bottom:none}
.rxbar{display:flex;gap:4px;padding:0 4px 7px;flex-wrap:wrap}
.rxb{display:inline-flex;align-items:center;gap:3px;font-size:13px;line-height:1;padding:3px 7px;border-radius:999px;background:var(--paper2);border:1px solid transparent;color:var(--text)}
.rxb.has{background:var(--paper);border-color:var(--line)}
.rxb.on{border-color:var(--gold);background:rgba(229,168,35,.16)}
.rxb.pick{font-size:15px;padding:4px 8px}
.rxb span{font-size:10px;font-weight:700;font-family:'Oswald';color:var(--text-dim)}
.rxadd{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);color:var(--text-dim);font-size:14px;font-weight:700;line-height:1}
.cup-burn{text-align:center;font-size:12px;font-style:italic;color:rgba(237,231,214,.68);margin-top:8px;line-height:1.4;min-height:16px}
.chip{background:var(--paper2);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;color:var(--text)}
.match-head{display:flex;justify-content:space-between;padding:4px 6px 6px;font-family:'Oswald';font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.mside{flex:1;display:flex;align-items:center;gap:6px;min-width:0;padding:5px 6px;border-radius:9px}
.mside.b{flex-direction:row;justify-content:flex-end;text-align:right}
.mside .mav{font-size:15px;flex:none;letter-spacing:-3px;margin-right:2px}
.mside.b .mav{margin-right:0;margin-left:2px}
.mside .mnames{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.mside .mnames span{font-weight:600;font-size:12.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mside.win .mnames span{color:var(--tc)}
.mstatus{flex:none;min-width:60px;text-align:center;font-family:'Oswald';display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.mstatus b{font-size:12.5px;font-weight:600}
.mstatus .ssub{font-size:9px;color:var(--text-dim);font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.mstatus .pre{color:var(--text-dim)}
.pairsel{width:100%;padding:8px;border-radius:8px;border:1px solid var(--line);background:#fff;margin-bottom:5px;font-size:14px}
.gscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.si-edit{display:flex}
.si-cell{flex:none;width:36px;text-align:center;padding:5px 2px;border-right:1px solid var(--line)}
.si-cell:last-child{border-right:none}
.si-cell .hh{display:block;font-size:9px;color:var(--text-dim);font-weight:700;margin-bottom:3px}
.si-cell input{width:30px;padding:4px 0;text-align:center;border:1px solid var(--line);border-radius:6px;font-size:12px;font-family:'Oswald';background:#fff}
.ggrid{display:inline-block;min-width:100%}
.grow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:none}
.gname{flex:none;width:78px;position:sticky;left:0;background:var(--paper);z-index:2;padding:5px 7px;font-size:12px;font-weight:600;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center}
.gname span{font-size:9px;color:var(--text-dim);font-weight:500}
.grow.ghead .gname{background:var(--paper2)}
.grow.ghead{background:var(--paper2)}
.gcell{flex:none;width:31px;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-size:12px;border-right:1px solid var(--line);color:var(--text-dim)}
.gcell:last-of-type{border-right:none}
.gcell.gh{flex-direction:column;font-weight:700;font-size:11px;color:var(--text);line-height:1;justify-content:center;padding:3px 0}
.gcell.gh span{font-size:8px;color:var(--text-dim);font-weight:500;margin-top:1px}
.gcell.gh span.si{color:var(--gold);font-weight:700}
.scell{background:transparent;height:36px;cursor:pointer}
.scell.has{color:var(--text-dim);font-weight:600}
.scell.ov.has{color:#fff;background:var(--gold);font-weight:800}
.scell.ov.z{color:var(--red);font-weight:800}
.greset{flex:none;width:32px;background:transparent;color:var(--text-dim);border:none;border-left:1px solid var(--line);font-size:15px;cursor:pointer}
.grow.ghead .greset{background:var(--paper2)}
.seg-toggle{display:flex;background:rgba(255,255,255,.06);border-radius:999px;padding:3px;margin-bottom:14px;gap:3px}
.seg-toggle button{flex:1;padding:8px;border-radius:999px;font-size:13px;font-weight:600;color:rgba(237,231,214,.6)}
.seg-toggle button.on{background:var(--gold);color:var(--ink)}
.draft-board{display:flex;gap:10px}
.draft-col{flex:1;background:var(--paper);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);border:2px solid transparent;min-width:0}
.draft-col.on{border-color:var(--tc)}
.draft-col-h{color:#fff;font-family:'Oswald';font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.03em;padding:8px 6px;text-align:center;line-height:1.2}
.draft-pick{display:flex;align-items:center;gap:6px;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px}
.draft-pick:last-child{border-bottom:none}
.draft-pick .dp-av{font-size:16px;flex:none}
.draft-pick .dp-nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.draft-pick .dp-n{font-family:'Oswald';font-size:11px;color:var(--text-dim);flex:none}
.draft-pool{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.draft-pickbtn{display:flex;align-items:center;gap:6px;background:var(--paper2);border:1px solid var(--line);border-radius:9px;padding:9px;font-size:13px;font-weight:600;text-align:left;color:var(--text)}
.draft-pickbtn small{margin-left:auto;color:var(--text-dim);font-family:'Roboto Mono'}
.onclock-card{text-align:center;border-radius:14px;padding:14px;margin-bottom:12px;background:var(--paper);box-shadow:var(--shadow)}
.fmt-i{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:10px;line-height:1;vertical-align:middle;margin-left:5px;opacity:.65;cursor:pointer;flex:none;text-transform:none}
.fmt-i:active{opacity:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="flag">⛳</span>
    <div>
      <h1 id="tripTitle">The Cup</h1>
      <small id="tripSub">Myrtle Beach · Oct 22–25</small>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:9px">
    <span id="syncDot" title="Synced" style="width:9px;height:9px;border-radius:50%;background:#5fce8f;flex:none;transition:background .3s"></span>
    <button class="me-chip" id="meChip" onclick="openIdentity()">
      <span class="av" id="meAv">＋</span><span id="meName">Sign in</span>
    </button>
  </div>
</div>

<div class="screen" id="screen"></div>

<div id="demoBar" class="hidden" style="position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:40;max-width:640px;margin:0 auto;background:#7a3ea8;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;font-size:13px;font-weight:600;box-shadow:0 -4px 14px rgba(0,0,0,.2)">
  <span>👁️ Demo preview — nothing is saved</span>
  <button onclick="clearDemo()" style="background:#fff;color:#7a3ea8;border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:13px">Exit demo</button>
</div>

<nav class="nav" id="nav"></nav>

<div id="modalHost"></div>

<script>
/* ============================================================
   The Cup — Myrtle Beach 2026
   Shared store: Netlify Blobs (via /api/store) with a
   localStorage / in-memory fallback so it runs before deploy.
   ============================================================ */

/* ---------- Shared store ---------- */
const Store = (() => {
  const API = '/api/store';
  const NS = 'mbg:';
  const OUTBOX = 'mbg-outbox';
  const mem = new Map();
  let connected = true;       // did the last network attempt succeed?
  let everConnected = false;  // have we ever reached the server at all?
  const subs = [];

  // ---- local cache (survives reloads; falls back to memory if storage blocked) ----
  const lsGet = (k) => { try { const v = localStorage.getItem(NS+k); return v==null?null:JSON.parse(v); } catch(e){ return mem.has(k)?mem.get(k):null; } };
  const lsSet = (k,v) => { try { localStorage.setItem(NS+k, JSON.stringify(v)); } catch(e){ mem.set(k,v); } };
  const lsDel = (k) => { try { localStorage.removeItem(NS+k); } catch(e){ mem.delete(k); } };
  const lsList = (p) => {
    const out={};
    try { for(let i=0;i<localStorage.length;i++){ const key=localStorage.key(i); if(key.startsWith(NS+p)) out[key.slice(NS.length)]=JSON.parse(localStorage.getItem(key)); } }
    catch(e){ for(const [k,v] of mem){ if(k.startsWith(p)) out[k]=v; } }
    return out;
  };

  // ---- outbox: writes not yet confirmed on the server (persisted, coalesced per key) ----
  const loadOutbox = () => { try { const raw=localStorage.getItem(OUTBOX); return raw?new Map(Object.entries(JSON.parse(raw))):new Map(); } catch(e){ return new Map(); } };
  const outbox = loadOutbox();
  const saveOutbox = () => { try { localStorage.setItem(OUTBOX, JSON.stringify(Object.fromEntries(outbox))); } catch(e){} };

  const status = () => ({ connected, everConnected, pending: outbox.size });
  const notify = () => { const s=status(); subs.forEach(f=>{ try{ f(s); }catch(e){} }); };
  const ok = () => { connected=true; everConnected=true; };
  const fail = () => { connected=false; };

  async function sGet(key){ const r=await fetch(`${API}?action=get&key=${encodeURIComponent(key)}`); if(!r.ok) throw 0; const j=await r.json(); if(!j.ok) throw 0; return j.data ?? null; }
  async function sList(prefix){ const r=await fetch(`${API}?action=list&prefix=${encodeURIComponent(prefix)}`); if(!r.ok) throw 0; const j=await r.json(); if(!j.ok) throw 0; return j.data||{}; }
  async function sSet(key,value){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'set',key,value})}); if(!r.ok) throw 0; await r.json(); }
  async function sDel(key){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'del',key})}); if(!r.ok) throw 0; await r.json(); }

  const pendingVal = (key)=>{ const e=outbox.get(key); return e ? (e.op==='del'?null:e.value) : undefined; };

  // ---- per-key write queue: guarantees writes to the SAME key reach the server in the order they were made.
  // Without this, two rapid saves to one key (e.g. entering hole after hole) can fire overlapping network
  // requests that arrive out of order, letting an earlier/incomplete write silently clobber a later one. ----
  const writeTails = new Map();
  function queuedWrite(key, op, value){
    const prev = writeTails.get(key) || Promise.resolve();
    const next = prev.then(async ()=>{
      try{
        if(op==='del') await sDel(key); else await sSet(key,value);
        // only clear the outbox if nothing newer has queued behind us for this key
        const cur=outbox.get(key);
        if(cur && cur.op===op && (op==='del' || cur.value===value)){ outbox.delete(key); saveOutbox(); }
        ok(); notify();
      }catch(e){ fail(); notify(); }   // stays queued; flush() retries
    });
    writeTails.set(key, next);
    return next;
  }

  async function flush(){
    if(!outbox.size) return;
    for(const [key,entry] of [...outbox]) queuedWrite(key, entry.op, entry.value);   // route through the same per-key queue
  }

  return {
    onStatus(f){ subs.push(f); },
    status,
    get online(){ return connected && everConnected; },
    get everConnected(){ return everConnected; },
    get pending(){ return outbox.size; },
    async get(key){
      try{ const d=await sGet(key); ok(); if(d!=null) lsSet(key,d); notify(); const p=pendingVal(key); return p!==undefined?p:d; }
      catch(e){ fail(); notify(); const p=pendingVal(key); return p!==undefined?p:lsGet(key); }
    },
    async list(prefix){
      let base;
      try{ base=await sList(prefix); ok(); Object.entries(base).forEach(([k,v])=>lsSet(k,v)); }
      catch(e){ fail(); base=lsList(prefix); }
      for(const [k,entry] of outbox){ if(k.startsWith(prefix)){ if(entry.op==='del') delete base[k]; else base[k]=entry.value; } }
      notify();
      return base;
    },
    async set(key,value){
      if(typeof State!=='undefined' && State.demo) return null;   // demo preview must never touch the real store
      lsSet(key,value); outbox.set(key,{op:'set',value}); saveOutbox(); notify();
      return queuedWrite(key,'set',value);
    },
    async del(key){
      if(typeof State!=='undefined' && State.demo) return null;   // demo preview must never touch the real store
      lsDel(key); outbox.set(key,{op:'del'}); saveOutbox(); notify();
      return queuedWrite(key,'del',null);
    },
    flush,
  };
})();

/* ---------- Format info icon (tap for details, visible to everyone) ---------- */
function fmtInfo(key){
  if(!key || !FORMATS[key]) return '';
  return `<span class="fmt-i" role="button" tabindex="0" onclick="event.stopPropagation();showFormatInfo('${key}')" title="Format details">i</span>`;
}
function scrambleMethodLabel(){
  const m=State.config?.settings?.scrambleHcp||'low';
  return ({low:"the side plays off its lowest handicap",usga:"USGA 35% / 15% of the pair",avg:"the average of the side's handicaps",scratch:"scratch — no strokes given"})[m]||m;
}
function formatDetailNote(key){
  if(!useHcp()) return 'Handicaps are turned off for this event — every format is played gross.';
  const pct=(f)=>Math.round(allowanceFor(f)*100);
  const map={
    singles:`Match play, 1 point per match. Each player gets their own stroke dots (from ${pct('singles')}% of course handicap, or the commissioner's stroke sheet); low net wins the hole.`,
    foursomes:`2-v-2 match play, one ball, partners alternating shots. The side plays off 50% of the pair's combined course handicap.`,
    betterball:`2-v-2 match play at ${pct('betterball')}% allowance; each hole the team takes the better net (dots included) of the two partners.`,
    shramble:`2-v-2 match play at ${pct('shramble')}% allowance. Best drive off the tee, then each partner plays their own ball in; low net wins the hole.`,
    scramble:`Match play, one ball per side. Side handicap: ${scrambleMethodLabel()}.`,
    teamtotal:`Stroke play — every player's net over the segment is added up and the lower team total wins.`,
  };
  return map[key]||'';
}
function showFormatInfo(key){
  const f=FORMATS[key]; if(!f) return;
  const note=formatDetailNote(key);
  showModal(`<div class="modal-h"><h2>${esc(f.label)}</h2></div>
    <div class="modal-b">
      <p style="line-height:1.6;color:var(--text);margin:0">${esc(f.blurb)}</p>
      ${note?`<div style="margin-top:12px;padding:11px 13px;background:var(--paper2);border-radius:10px;font-size:12px;color:var(--text-dim);line-height:1.55">${esc(note)}</div>`:''}
      <button class="btn" style="margin-top:14px" onclick="closeModal()">Got it</button>
    </div>`);
}

const REACT_EMOJIS = ['🔥','💀','🐐','🚽','🍺','😴'];
const matchKeyOf = (rid,segId,mid)=>`${rid}:${segId}:${mid}`;
function reactionsFor(mk){ const out={}; Object.values(State.reactions).forEach(map=>{ const e=map&&map[mk]; if(e) out[e]=(out[e]||0)+1; }); return out; }
function myReaction(mk){ return State.me ? (State.reactions[State.me]?.[mk]||null) : null; }
async function toggleReaction(mk, emoji){
  if(!State.me){ openIdentity(); return; }
  const map={...(State.reactions[State.me]||{})};
  if(map[mk]===emoji) delete map[mk]; else map[mk]=emoji;
  State.reactions[State.me]=map;
  const el=document.getElementById('rx-'+mk);
  if(el){ el.outerHTML=reactionBarHTML(mk); } else if(State.view==='board'){ updateBoard(); }
  Store.set('react:'+State.me,{map});
}
function reactionBarHTML(mk){
  const counts=reactionsFor(mk), mine=myReaction(mk);
  const chips=REACT_EMOJIS.filter(e=>counts[e]).map(e=>`<button class="rxb has ${mine===e?'on':''}" onclick="event.stopPropagation();toggleReaction('${mk}','${e}')">${e}${counts[e]>1?`<span>${counts[e]}</span>`:''}</button>`).join('');
  return `<div class="rxbar" id="rx-${mk}">${chips}<button class="rxadd" onclick="event.stopPropagation();openReactPicker('${mk}')" title="Add a reaction">＋</button></div>`;
}
function openReactPicker(mk){
  if(!State.me){ openIdentity(); return; }
  const el=document.getElementById('rx-'+mk); if(!el) return;
  const mine=myReaction(mk);
  el.innerHTML = REACT_EMOJIS.map(e=>`<button class="rxb pick ${mine===e?'on':''}" onclick="event.stopPropagation();toggleReaction('${mk}','${e}')">${e}</button>`).join('')
    + `<button class="rxadd" onclick="event.stopPropagation();closeReactPicker('${mk}')" title="Close">✕</button>`;
}
function closeReactPicker(mk){ const el=document.getElementById('rx-'+mk); if(el) el.outerHTML=reactionBarHTML(mk); }

function autoTitle(pid){
  const withH=(State.config.players||[]).filter(p=>hcpOf(p.id)!=null);
  if(withH.length>=3){
    const s=[...withH].sort((a,b)=>hcpOf(a.id)-hcpOf(b.id));
    if(s[0].id===pid) return 'The Ringer 🎯';
    if(s[s.length-1].id===pid) return 'Max Strokes 🎒';
  }
  return '';
}
const NO_TITLE = '\u2205'; // sentinel: player/admin explicitly hid the title, don't fall back to auto
function titleOf(pid){
  const t=State.titles[pid];
  if(t===NO_TITLE) return '';
  return t || autoTitle(pid) || '';
}
async function setTitle(pid, text){
  text=(text||'').trim().slice(0,40);
  if(text) State.titles[pid]=text; else State.titles[pid]=NO_TITLE;   // explicit clear, not just "no override"
  closeModal(); render();
  Store.set('title:'+pid,{text: text||NO_TITLE});
}
async function resetTitleAuto(pid){
  delete State.titles[pid];
  closeModal(); render();
  Store.del('title:'+pid);
}
const TITLE_SUGGESTIONS=['The Sandbagger','Cart Path Only','Beer Cart MVP','Mr. Irrelevant','Three-Putt King','Snowman Collector ☃️','The Commish','Mathlete','Sunday Scaries','36.9 and Proud','The Ringer 🎯','Gimme Merchant'];
function renderTitleEditor(pid){
  if(!pid) return;
  if(!(State.adminAuthed || pid===State.me)) return;
  const raw=State.titles[pid];               // undefined = auto, NO_TITLE = explicitly hidden, string = manual
  const manual = (raw && raw!==NO_TITLE) ? raw : '';
  const auto = autoTitle(pid);
  const shown = titleOf(pid);
  const hint = raw===NO_TITLE ? 'Currently hidden.' : (!manual && auto ? `Currently showing the automatic title: <b>${esc(auto)}</b>.` : '');
  showModal(`<div class="modal-h"><h2>${esc(player(pid)?.name||'')}</h2><p class="muted" style="margin:4px 0 0">Give ${pid===State.me?'yourself':'them'} a superlative — it shows by the name for everyone. ${hint}</p></div>
    <div class="modal-b">
      <div class="field"><input id="titleInput" maxlength="40" placeholder="e.g. The Sandbagger" value="${esc(manual)}"/></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${TITLE_SUGGESTIONS.map(t=>`<button class="chip" onclick="document.getElementById('titleInput').value=this.textContent">${esc(t)}</button>`).join('')}</div>
      <button class="btn gold" onclick="setTitle('${pid}',document.getElementById('titleInput').value)">Save</button>
      ${shown?`<button class="btn ghost" style="margin-top:8px" onclick="setTitle('${pid}','')">Remove title — show nothing</button>`:''}
      ${(raw!==undefined && auto)?`<button class="btn ghost" style="margin-top:8px" onclick="resetTitleAuto('${pid}')">Restore automatic (${esc(auto)})</button>`:''}
    </div>`);
}

function scanHoles(cb){
  (State.config.rounds||[]).forEach(r=>{ const c=courseOf(r), pars=c?.pars||[]; segsOf(r).forEach(seg=>{ if(!seg.format||FORMATS[seg.format]?.side==='group') return; (State.config.players||[]).forEach(p=>{ const card=State.cards[cardKey(r.id,seg.id,p.id)]; if(!card?.holes) return; Object.keys(card.holes).forEach(h=>{ const g=card.holes[h]; if(g==null) return; cb({pid:p.id, round:r, hole:Number(h), gross:g, par:pars[h-1]||4}); }); }); }); });
}
function worstHole(){ let w=null; scanHoles(o=>{ const over=o.gross-o.par; if(!w||over>w.over) w={...o,over}; }); return w; }
function burnLine(){
  const {A,B,pA,pB}=boardStats(), avail=pointsAvailable();
  if(avail<=0) return "🏌️ Set the formats and let's make someone cry.";
  const diff=Math.abs(pA-pB), leader=pA>pB?A:B, trailer=pA>pB?B:A;
  let lines;
  if(pA===pB) lines=["All square — tighter than a range-ball dimple.","Deadlocked. Somebody grow a spine.","Even Steven, and everyone's nervous."];
  else if(diff>=Math.max(2,avail/3)) lines=[`🧹 ${esc(leader.name)} is out shopping for brooms.`,`${esc(leader.name)} is treating this like a charity scramble.`,`Someone check on ${esc(trailer.name)} — bring snacks.`];
  else lines=[`${esc(leader.name)} nudges ahead — don't get comfy.`,`${esc(leader.name)} leads, but choke season is undefeated.`,`${esc(leader.name)} up. ${esc(trailer.name)} still has a pulse.`];
  const bw=worstHole(); if(bw && bw.over>=4) lines.push(`☃️ ${esc(displayName(bw.pid))} made a ${bw.gross} on a par ${bw.par}. Bold.`);
  const key=`${Math.round(pA*2)}_${Math.round(pB*2)}_${lines.length}`;
  const idx=[...key].reduce((a,c)=>a+c.charCodeAt(0),0)%lines.length;
  return lines[idx];
}

function playerRoundStat(round, pid){
  const c=courseOf(round), pars=c?.pars||[]; let gross=0,net=0,thru=0,blow=0,parPlayed=0,any=false;
  segsOf(round).forEach(seg=>{ if(!seg.format||FORMATS[seg.format]?.side==='group') return; const card=State.cards[cardKey(round.id,seg.id,pid)]; if(!card?.holes) return; Object.keys(card.holes).forEach(h=>{ const g=card.holes[h]; if(g==null) return; any=true; gross+=g; thru++; const par=pars[h-1]||4; parPlayed+=par; if(g-par>=3) blow++; }); const n=netForCard(pid,card,false,round,seg.format); if(n!=null) net+=n; });
  return any?{pid,gross,net,thru,blow,parPlayed}:null;
}
function roundGoats(round){
  const stats=(State.config.players||[]).map(p=>playerRoundStat(round,p.id)).filter(s=>s&&s.thru>=3);
  if(!stats.length) return null;
  const byNet=[...stats].sort((a,b)=>a.net-b.net);
  return { hero:byNet[0], goat:byNet[byNet.length-1] };
}
function shameStats(){
  const worst=worstHole();
  const blowCount={}; scanHoles(o=>{ if(o.gross-o.par>=3) blowCount[o.pid]=(blowCount[o.pid]||0)+1; });
  let mostBlow=null; Object.entries(blowCount).forEach(([pid,n])=>{ if(!mostBlow||n>mostBlow.n) mostBlow={pid,n}; });
  const totalNet={}; (State.config.players||[]).forEach(p=>{ let s=0,any=false; (State.config.rounds||[]).forEach(r=>{ const st=playerRoundStat(r,p.id); if(st){ s+=st.net; any=true; } }); if(any) totalNet[p.id]=s; });
  let dfl=null; Object.entries(totalNet).forEach(([pid,n])=>{ if(!dfl||n>dfl.n) dfl={pid,n}; });
  return { worst, mostBlow, dfl };
}

function reconcileTrip(){
  // Heal a config that was seeded by an earlier version: backfill courses,
  // round→course links, tee times and roster WITHOUT touching user edits
  // (teams, handicaps, captains, formats, groups, avatars, scores).
  const def=DEFAULT_CONFIG();
  const cfg=State.config;
  let changed=false;
  cfg.settings=cfg.settings||{};
  ['resort','checkIn','bookingRef','tripSub','tripName','scrambleHcp'].forEach(k=>{
    if(!cfg.settings[k] && def.settings[k]){ cfg.settings[k]=def.settings[k]; changed=true; }
  });
  if(!/villas/i.test(cfg.settings.resort||'')){ cfg.settings.resort=def.settings.resort; changed=true; }
  if(cfg.settings.useHandicaps===undefined){ cfg.settings.useHandicaps=true; changed=true; }
  if(!cfg.settings.allowance){ cfg.settings.allowance=JSON.parse(JSON.stringify(def.settings.allowance)); changed=true; }
  cfg.courses=cfg.courses||[];
  def.courses.forEach(dc=>{
    let c=cfg.courses.find(x=>x.id===dc.id);
    if(!c){ cfg.courses.push(JSON.parse(JSON.stringify(dc))); changed=true; return; }
    const stale=!c.pars || c.pars.length!==18 || c.pars.every(p=>p===4) || !c.si;
    if(stale){ c.pars=dc.pars.slice(); c.si=dc.si.slice(); c.par=dc.par; changed=true; }
    if(!Array.isArray(c.tees)){ c.tees=JSON.parse(JSON.stringify(dc.tees)); changed=true; }
    if(!c.tee){ c.tee=dc.tee; changed=true; }
    // keep active rating/slope in sync with the selected tee
    const sel=(c.tees||[]).find(t=>t.name===c.tee) || c.tees?.[0];
    if(sel){ if(c.rating!==sel.rating){ c.rating=sel.rating; changed=true; } if(c.slope!==sel.slope){ c.slope=sel.slope; changed=true; } if(!c.tee){ c.tee=sel.name; changed=true; } }
    if(!c.address){ c.address=dc.address; changed=true; }
  });
  cfg.rounds=cfg.rounds||[];
  def.rounds.forEach(dr=>{
    let r=cfg.rounds.find(x=>x.id===dr.id);
    if(!r){ cfg.rounds.push(JSON.parse(JSON.stringify(dr))); changed=true; return; }
    if(!r.courseId){ r.courseId=dr.courseId; changed=true; }
    if(!r.teeTime){ r.teeTime=dr.teeTime; changed=true; }
    if(!r.dateLabel){ r.dateLabel=dr.dateLabel; changed=true; }
    if(!r.name){ r.name=dr.name; changed=true; }
    // migrate legacy single-format rounds to the segment model
    if(!r.segments || !r.segments.length){
      r.segments=[{id:'f', label:'All 18', start:1, end:18, format:r.format||'', groups:r.groups||[], matches:[]}];
      r.split=!!r.split;
      delete r.format; delete r.groups;
      changed=true;
    }
    // adopt the commissioner's format plan ONLY for rounds not yet configured
    const hasFmt=(r.segments||[]).some(s=>s.format);
    if(!hasFmt && (dr.segments||[]).some(s=>s.format)){
      r.split=dr.split; r.segments=JSON.parse(JSON.stringify(dr.segments)); changed=true;
    }
  });
  if(!cfg.players || !cfg.players.length){ cfg.players=def.players; changed=true; }
  // backfill commissioner handicaps where a player has none set yet
  (cfg.players||[]).forEach(p=>{
    if((p.hcp==null || p.hcp==='') && HANDICAP_PLAN[p.id]!=null){ p.hcp=HANDICAP_PLAN[p.id]; changed=true; }
  });
  return changed;
}

const State = {
  config:null,
  avatars:{},   // playerId -> emoji  (from avatar:* blobs)
  hcps:{},      // playerId -> handicap index (from hcp:* blobs)
  votes:{},     // voterId -> [candidate playerIds] (from vote:* blobs)
  reactions:{}, // voterId -> { matchKey: emoji } (from react:* blobs)
  titles:{},    // playerId -> superlative text (from title:* blobs)
  cards:{},     // 'card:round:side' -> {holes,enteredBy,updatedAt}
  me:null,      // playerId
  view:'board',
  boardMode:'matches',
  activeRound:null,
  entrySeg:null,
  entrySide:null,
  entryHole:1,
  adminAuthed:false,
};

/* ---------- Helpers ---------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const el = (html)=>{ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; };
const esc = (s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const player = (id)=> (State.config?.players||[]).find(p=>p.id===id);
const team = (id)=> (State.config?.teams||[]).find(t=>t.id===id);
const course = (id)=> (State.config?.courses||[]).find(c=>c.id===id);
const avatarOf = (id)=> State.avatars[id] || player(id)?.avatar || '🏌️';
const hcpOf = (id)=>{ const v = State.hcps[id]!=null ? State.hcps[id] : player(id)?.hcp; return (v==null||v==='')?null:Number(v); };
// Handicap Index -> Course Handicap for a given course: Index x Slope/113 + (Rating - Par)
function courseHandicap(index, c){
  if(index==null || !c || c.slope==null || c.rating==null || c.par==null) return null;
  return Math.round(index * (c.slope/113) + (c.rating - c.par));
}
const holeCount = ()=> State.config?.settings?.holeCount || 18;
const useHcp = ()=> State.config?.settings?.useHandicaps!==false;
const hcpLocked = ()=> !!State.config?.settings?.hcpLocked;
const allowanceFor = (fmt)=>{ const a=State.config?.settings?.allowance||{}; return (a[fmt]!=null?a[fmt]:100)/100; };
const isCaptain = (pid)=> !!player(pid)?.isCaptain;
const teammates = (pid)=>{ const p=player(pid); return (State.config?.players||[]).filter(x=>x.teamId===p?.teamId); };

function parsFor(roundId){
  const r=(State.config.rounds||[]).find(x=>x.id===roundId);
  const c=course(r?.courseId);
  const n=holeCount();
  if(c?.pars?.length===n) return c.pars;
  return Array.from({length:n},()=>4); // default par 4 until course info arrives
}
function cardKey(roundId,segId,sideId){ return `card:${roundId}:${segId}:${sideId}`; }
function grossTotal(card){ if(!card?.holes) return null; const v=Object.values(card.holes).filter(x=>x!=null); return v.length?v.reduce((a,b)=>a+b,0):null; }
function holesPlayed(card){ return card?.holes ? Object.values(card.holes).filter(x=>x!=null).length : 0; }

// segments of a round (always returns at least one)
function segsOf(round){
  if(round?.segments?.length) return round.segments;
  return [{id:'f', label:'All 18', start:1, end:18, format:round?.format||'', groups:round?.groups||[]}];
}
const courseOf = (round)=> course(round?.courseId);
// strokes a course-handicap receives on a hole of given stroke index
function strokesOnHole(ch, si){
  if(ch==null || si==null) return 0;
  const a=Math.abs(ch), base=Math.floor(a/18), rem=a%18;
  const s=base+(si<=rem?1:0);
  return ch<0 ? -s : s;
}
/* ---------- Stroke sheet: absolute strokes per player, per round, per hole ----------
   Auto value comes from the handicap math; the commissioner can override any
   cell (0/1/2/3). Match play, team total, the player board, and the entry dots
   all read this one function, so nothing can disagree. */
function segForHole(round, hole){
  return segsOf(round).find(s => s.format && hole>=s.start && hole<=s.end) || null;
}
function autoStrokes(pid, round, hole){
  if(!useHcp()) return 0;
  const seg=segForHole(round, hole); if(!seg) return 0;
  const c=courseOf(round);
  const eff=Math.round(courseHcpOf(pid,c)*allowanceFor(seg.format));
  return strokesOnHole(eff, c?.si?c.si[hole-1]:null);
}
function getStrokeOverride(rid, pid, hole){
  const v=State.config?.strokeOverrides?.[rid]?.[pid]?.[hole];
  return v==null ? null : v;
}
function strokeSheet(pid, round, hole){
  const ov=getStrokeOverride(round.id, pid, hole);
  return ov!=null ? ov : autoStrokes(pid, round, hole);
}
function playerHasOverrides(rid, pid){
  const o=State.config?.strokeOverrides?.[rid]?.[pid];
  return !!o && Object.keys(o).length>0;
}
// net for a single side's card within a segment — reads the stroke sheet
function netForCard(sideId, card, isGroup, round, fmt){
  const g=grossTotal(card); if(g==null) return null;
  if(isGroup || !useHcp()) return g; // group handicap handled by the side; gross when handicaps off
  if(hcpOf(sideId)==null && !playerHasOverrides(round.id,sideId)) return g;
  let strokes=0;
  Object.keys(card.holes||{}).forEach(h=>{ if(card.holes[h]!=null) strokes+=strokeSheet(sideId, round, Number(h)); });
  return g - strokes;
}
function segPar(round, seg){
  const c=courseOf(round); if(!c?.pars) return null;
  let p=0; for(let h=seg.start; h<=seg.end; h++) p+=c.pars[h-1]||0; return p;
}

/* ---------- Matches / pairings ---------- */
const segMatches = (seg)=> seg?.matches || [];
const perSideFor = (fmt)=> FORMATS[fmt]?.perSide || (fmt==='singles'?1:2);
const teamRoster = (teamId)=> (State.config.players||[]).filter(p=>p.teamId===teamId);
const teamOfSide = (ids)=> ids.map(id=>player(id)?.teamId).find(Boolean) || null;
function matchOfSide(seg, sideId){
  const ms=segMatches(seg); if(!ms.length||!sideId) return null;
  if(String(sideId).includes(':')){ const mid=String(sideId).split(':')[0]; return ms.find(m=>m.id===mid)||null; }
  return ms.find(m=>[...m.a,...m.b].includes(sideId))||null;
}
function startHoleForSide(seg, sideId){
  const m=matchOfSide(seg, sideId);
  const s=m&&m.start;
  return (s!=null && s!=='') ? Number(s) : seg.start;
}

/* which sides exist for a segment — derived from matches when present */
function sidesForSeg(round, seg){
  if(!round||!seg) return [];
  const isGroup=FORMATS[seg.format]?.side==='group';
  const ms=segMatches(seg);
  if(ms.length){
    if(isGroup){
      const out=[];
      ms.forEach(m=>{
        out.push({id:m.id+':a', kind:'group', members:m.a, teamId:teamOfSide(m.a)});
        out.push({id:m.id+':b', kind:'group', members:m.b, teamId:teamOfSide(m.b)});
      });
      return out;
    }
    const ids=new Set(); ms.forEach(m=>[...m.a,...m.b].forEach(id=>ids.add(id)));
    return [...ids].map(id=>({id, kind:'player', teamId:player(id)?.teamId}));
  }
  // fallback before pairings are set
  if(isGroup){
    return (State.config.teams||[]).map(t=>({id:t.id, kind:'group', members:teamRoster(t.id).map(p=>p.id), teamId:t.id}));
  }
  return (State.config.players||[]).map(p=>({id:p.id, kind:'player', teamId:p.teamId}));
}
function sideLabel(side){
  if(side.kind==='player') return player(side.id)?.name || '—';
  const names=(side.members||[]).map(id=>player(id)?.name?.split(' ')[0]).filter(Boolean);
  return names.length?names.join(' + '):'Group';
}
function sideAvatar(side){ return side.kind==='player'? avatarOf(side.id) : '⛳'; }
// First name, with last initial when another player shares that first name
function displayName(pid){
  const p=player(pid); if(!p) return '?';
  const parts=String(p.name).trim().split(/\s+/); const first=parts[0]||'?';
  const clash=(State.config.players||[]).some(o=>o.id!==pid && (String(o.name).trim().split(/\s+/)[0]||'').toLowerCase()===first.toLowerCase());
  return (clash && parts.length>1) ? `${first} ${parts[parts.length-1][0]}.` : first;
}
function tint(hex,a){ const h=(hex||'#999').replace('#',''); const s=h.length===3?h.split('').map(c=>c+c).join(''):h; const n=parseInt(s,16)||0; return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
function cmpHcp(a,b){ const ha=hcpOf(a.id), hb=hcpOf(b.id); return (ha==null?999:ha)-(hb==null?999:hb); }
function cmpCapHcp(a,b){ const c=(b.isCaptain?1:0)-(a.isCaptain?1:0); return c!==0?c:cmpHcp(a,b); } // captain first, then handicap

/* who can THIS device enter for, in a segment */
function editableSidesForSeg(round, seg){
  const sides=sidesForSeg(round, seg);
  if(!State.me) return [];
  const meId=State.me, cap=isCaptain(meId), myTeam=player(meId)?.teamId;
  const ms=segMatches(seg);
  if(FORMATS[seg.format]?.side==='group'){
    // scramble: my side (I'm a member) + captain sees all my team's sides
    return sides.filter(s => cap ? s.teamId===myTeam : (s.members||[]).includes(meId));
  }
  // individual: me + partners on my side of my match + (captain) whole team
  let partners=[];
  const myMatch=ms.find(m=>[...m.a,...m.b].includes(meId));
  if(myMatch){ partners = myMatch.a.includes(meId)?myMatch.a:myMatch.b; }
  return sides.filter(s => s.id===meId || partners.includes(s.id) || (cap && player(s.id)?.teamId===myTeam));
}

/* ---------- MATCH-PLAY ENGINE ----------
   Net, hole-by-hole, difference method: within a match the low course
   handicap plays off scratch and the others receive the difference,
   allocated by stroke index. Each match is worth 1 point (½ for a halve). */
function courseHcpOf(id, c){ const idx=hcpOf(id); const ch=courseHandicap(idx,c); return ch!=null?ch:(idx!=null?Math.round(idx):0); }
// playing handicap for an individual: course handicap x format allowance, 0 if handicaps off
function playingCH(id, c, fmt){ if(!useHcp()) return 0; return Math.round(courseHcpOf(id,c)*allowanceFor(fmt)); }
function sideCH(ids, c, fmt){
  if(!useHcp()) return 0;
  const chs=ids.map(id=>courseHcpOf(id,c)).sort((a,b)=>a-b);
  if(!chs.length) return 0;
  if(fmt==='foursomes') return Math.round(0.5*chs.reduce((a,b)=>a+b,0)); // USGA alt-shot: 50% of combined
  const method=State.config?.settings?.scrambleHcp||'low';
  if(method==='scratch') return 0;
  if(method==='avg') return Math.round(chs.reduce((a,b)=>a+b,0)/chs.length);
  if(method==='usga') return chs.length===2 ? Math.round(0.35*chs[0]+0.15*chs[1]) : Math.round(chs.reduce((a,b)=>a+b,0)/chs.length);
  return chs[0]; // 'low' — side plays off its lowest handicap
}
function matchValFns(round, seg, match){
  const c=courseOf(round); const si=c?.si||[]; const fmt=seg.format;
  const isGroup=FORMATS[fmt]?.side==='group';
  let aVal, bVal;
  if(isGroup){
    const aCH=sideCH(match.a,c,fmt), bCH=sideCH(match.b,c,fmt), low=Math.min(aCH,bCH);
    const aStk=aCH-low, bStk=bCH-low;
    const aCard=State.cards[cardKey(round.id,seg.id,match.id+':a')];
    const bCard=State.cards[cardKey(round.id,seg.id,match.id+':b')];
    aVal=(h)=> aCard?.holes?.[h]!=null ? aCard.holes[h]-strokesOnHole(aStk,si[h-1]) : null;
    bVal=(h)=> bCard?.holes?.[h]!=null ? bCard.holes[h]-strokesOnHole(bStk,si[h-1]) : null;
  } else {
    // Individual formats: each player plays their own strokes from the sheet; low net wins the hole
    const bestNet=(ids,h)=>{ let best=null; ids.forEach(id=>{ const g=State.cards[cardKey(round.id,seg.id,id)]?.holes?.[h]; if(g!=null){ const nt=g-strokeSheet(id,round,h); if(best==null||nt<best) best=nt; } }); return best; };
    aVal=(h)=>bestNet(match.a,h); bVal=(h)=>bestNet(match.b,h);
  }
  return {aVal,bVal,isGroup};
}
function computeMatch(round, seg, match){
  const {aVal,bVal}=matchValFns(round, seg, match);
  let aUp=0,bUp=0,played=0;
  for(let h=seg.start; h<=seg.end; h++){ const a=aVal(h), b=bVal(h); if(a==null||b==null) continue; played++; if(a<b)aUp++; else if(b<a)bUp++; }
  const total=seg.end-seg.start+1, remaining=total-played, diff=aUp-bUp;
  const clinched=Math.abs(diff)>remaining;
  const final=remaining===0 || clinched;
  return {aUp,bUp,played,remaining,diff,final};
}
// Aggregate scoring within one tee-time group (Team Total, when pairings exist): sum each side's net
// across ITS OWN players only, not the whole field — this is the fix for "compare within each match".
function computeAggregateMatch(round, seg, match){
  const totalFor=(ids)=>{
    let sum=0, thruMin=null, any=false;
    ids.forEach(id=>{
      const card=State.cards[cardKey(round.id,seg.id,id)];
      const net=netForCard(id,card,false,round,seg.format);
      const thru=holesPlayed(card||{holes:{}});
      if(net!=null){ sum+=net; any=true; }
      thruMin = thruMin==null ? thru : Math.min(thruMin,thru);
    });
    return {total:any?sum:null, thru:thruMin||0};
  };
  const A=totalFor(match.a), B=totalFor(match.b);
  const total=seg.end-seg.start+1;
  const thru=Math.min(A.thru,B.thru);
  return {aTotal:A.total, bTotal:B.total, thru, remaining:total-thru, final:thru>=total};
}
function aggPointSplit(agg){
  if(agg.aTotal==null || agg.bTotal==null) return null;
  if(agg.aTotal===agg.bTotal) return {a:0.5,b:0.5};
  return agg.aTotal<agg.bTotal ? {a:1,b:0} : {a:0,b:1};
}
function matchStatusText(res){
  const p=matchStatusParts(res); return p.sub?`${p.main} · ${p.sub}`:p.main;
}
function matchStatusParts(res){
  if(res.played===0) return {main:'—'};
  const u=Math.abs(res.diff);
  if(res.diff===0) return res.remaining===0 ? {main:'Halved'} : {main:'AS', sub:`thru ${res.played}`};
  if(res.final && res.remaining>0) return {main:`${u}&${res.remaining}`};   // closed out
  if(res.remaining===0) return {main:`${u} UP`, sub:'final'};
  return {main:`${u} UP`, sub:`thru ${res.played}`};
}
function matchPointSplit(res){
  if(res.played===0) return null;
  if(res.diff===0) return {a:0.5,b:0.5};
  return res.diff>0 ? {a:1,b:0} : {a:0,b:1};
}
// which side of the match ('a'/'b') a given entry-side id corresponds to
function entrySideOfMatch(seg, sideId, m){
  if(FORMATS[seg.format]?.side==='group') return String(sideId).endsWith(':a') ? 'a' : 'b';
  return m.a.includes(sideId) ? 'a' : 'b';
}
// teammates sharing this player's side of the match (better ball / shramble / Team Total pairs) — null if solo or a shared-card group format
function partnerSideIds(seg, sideId){
  if(FORMATS[seg.format]?.side==='group') return null;   // foursomes/scramble already share one card
  const m=matchOfSide(seg, sideId); if(!m) return null;
  const mySide = entrySideOfMatch(seg, sideId, m)==='a' ? m.a : m.b;
  return mySide.length>1 ? mySide : null;
}
// did MY side win/lose/halve this specific hole? null = no opponent context or not enough data yet
function holeOutcomeForSide(round, seg, sideId, hole){
  const m=matchOfSide(seg, sideId); if(!m) return null;
  const {aVal,bVal}=matchValFns(round, seg, m);
  const imA=entrySideOfMatch(seg, sideId, m)==='a';
  const mine=imA?aVal(hole):bVal(hole), theirs=imA?bVal(hole):aVal(hole);
  if(mine==null || theirs==null) return {outcome:null};
  return {outcome: mine<theirs?'won':(mine>theirs?'lost':'halved')};
}
// live match status from MY side's perspective ("2 UP · thru 5", not always A's perspective)
function personalMatchStatus(round, seg, sideId){
  const m=matchOfSide(seg, sideId); if(!m) return null;
  const isAgg=FORMATS[seg.format]?.scoring==='aggregate';
  if(isAgg){
    const agg=computeAggregateMatch(round, seg, m);
    if(agg.thru===0 || agg.aTotal==null || agg.bTotal==null) return {main:'Group not started yet', sub:'', cls:''};
    const imA=entrySideOfMatch(seg, sideId, m)==='a';
    const mine=imA?agg.aTotal:agg.bTotal, theirs=imA?agg.bTotal:agg.aTotal;
    const diff=theirs-mine, sub=agg.final?'final':`thru ${agg.thru}`;
    if(diff===0) return {main:'Tied', sub, cls:'half'};
    return {main:`${diff>0?'+':''}${diff} strokes`, sub, cls:diff>0?'win':'lose'};
  }
  const res=computeMatch(round, seg, m);
  if(res.played===0) return {main:'Match not started yet', sub:'', cls:''};
  const imA=entrySideOfMatch(seg, sideId, m)==='a';
  const myDiff=imA?res.diff:-res.diff, u=Math.abs(myDiff);
  if(myDiff===0) return res.remaining===0 ? {main:'Halved', sub:'', cls:'half'} : {main:'All Square', sub:`thru ${res.played}`, cls:'half'};
  if(res.final && res.remaining>0) return {main: myDiff>0?`Won ${u}&${res.remaining}`:`Lost ${u}&${res.remaining}`, sub:'', cls: myDiff>0?'win':'lose'};
  if(res.remaining===0) return {main:`${u} ${myDiff>0?'UP':'DOWN'}`, sub:'final', cls: myDiff>0?'win':'lose'};
  return {main:`${u} ${myDiff>0?'UP':'DOWN'}`, sub:`thru ${res.played}`, cls: myDiff>0?'win':'lose'};
}
// personal net for a single hole — works even with no opponent yet (aggregate formats, or unpaired individual formats)
function entryStrokesForHole(round, seg, sideId, hole){
  if(!useHcp()) return 0;
  if(FORMATS[seg.format]?.side==='group'){
    const m=matchOfSide(seg, sideId); if(!m) return 0; // no opponent yet — side handicap is relative, can't compute
    const c=courseOf(round), part=entrySideOfMatch(seg, sideId, m);
    const aCH=sideCH(m.a,c,seg.format), bCH=sideCH(m.b,c,seg.format), low=Math.min(aCH,bCH);
    const stk=(part==='a'?aCH:bCH)-low;
    return strokesOnHole(stk, c?.si?.[hole-1]) || 0;
  }
  return strokeSheet(sideId, round, hole) || 0;
}
function entryNetForHole(round, seg, sideId, hole, gross){
  if(gross==null || !useHcp()) return gross;
  return gross - entryStrokesForHole(round, seg, sideId, hole);
}
// net contribution of an entire group (all its players) on one hole — only counts once everyone in the group has entered that hole
function groupHoleNet(round, seg, ids, hole){
  let sum=0, allIn=true;
  ids.forEach(id=>{
    const card=State.cards[cardKey(round.id,seg.id,id)];
    const g=card?.holes?.[hole];
    if(g==null){ allIn=false; return; }
    sum += entryNetForHole(round,seg,id,hole,g);
  });
  return allIn ? sum : null;
}
// cumulative match state through each hole, from MY side's perspective — for the per-hole "+/-" row
function matchProgressionForSide(round, seg, sideId){
  const m=matchOfSide(seg, sideId); if(!m) return null;
  const isAgg=FORMATS[seg.format]?.scoring==='aggregate';
  const imA=entrySideOfMatch(seg, sideId, m)==='a';
  const out={};
  if(isAgg){
    let aCum=0,bCum=0;
    for(let h=seg.start; h<=seg.end; h++){
      const an=groupHoleNet(round,seg,m.a,h), bn=groupHoleNet(round,seg,m.b,h);
      if(an==null||bn==null){ out[h]=null; continue; }
      aCum+=an; bCum+=bn;
      const diff = imA ? (bCum-aCum) : (aCum-bCum);   // positive = my group's cumulative net is lower (ahead)
      out[h] = {diff, isAgg:true};
    }
    return out;
  }
  const {aVal,bVal}=matchValFns(round, seg, m);
  let aUp=0,bUp=0;
  for(let h=seg.start; h<=seg.end; h++){
    const a=aVal(h), b=bVal(h);
    const settled = a!=null && b!=null;
    if(settled){ if(a<b) aUp++; else if(b<a) bUp++; }
    const diff = imA ? (aUp-bUp) : (bUp-aUp);
    out[h] = settled ? {diff} : null;
  }
  return out;
}
function matchCellLabel(entry){
  if(!entry) return {text:'', cls:''};
  if(entry.isAgg){
    if(entry.diff===0) return {text:'E', cls:'as'};
    return {text:`${entry.diff>0?'+':''}${entry.diff}`, cls: entry.diff>0?'win':'lose'};
  }
  if(entry.diff===0) return {text:'AS', cls:'as'};
  return {text:`${Math.abs(entry.diff)}${entry.diff>0?'UP':'DN'}`, cls: entry.diff>0?'win':'lose'};
}

/* ---------- Standings ---------- */
function segTeamNet(round, seg){ // provisional fallback when no matches defined
  const out={}; (State.config.teams||[]).forEach(t=>out[t.id]={net:0,played:false});
  const isGroup=FORMATS[seg.format]?.side==='group';
  sidesForSeg(round, seg).forEach(s=>{
    const card=State.cards[cardKey(round.id,seg.id,s.id)];
    const n=netForCard(s.id,card,isGroup,round,seg.format);
    if(n!=null && s.teamId && out[s.teamId]){ out[s.teamId].net+=n; out[s.teamId].played=true; }
  });
  return out;
}
const segWeight = (seg)=> (seg?.weight!=null && seg.weight!=='') ? Number(seg.weight) : 1;
function pointsAvailable(){
  let n=0;
  const teamsHavePlayers = (State.config.teams||[]).length>0 && (State.config.teams||[]).every(t=>teamRoster(t.id).length>0);
  (State.config.rounds||[]).filter(r=>!r.test).forEach(r=>segsOf(r).forEach(seg=>{
    if(!seg.format) return;
    const w=segWeight(seg);
    if(FORMATS[seg.format]?.scoring==='aggregate'){
      const ms=segMatches(seg);
      n += ms.length ? ms.length*w : (teamsHavePlayers ? w : 0);
    }
    else { n += segMatches(seg).length*w; }
  }));
  return n;
}
function pointsToClinch(){ const a=pointsAvailable(); return a>0 ? a/2 + 0.5 : 0; }
function tripPoints(){
  const pts={}; (State.config.teams||[]).forEach(t=>pts[t.id]=0);
  (State.config.rounds||[]).filter(r=>!r.test).forEach(r=>{
    segsOf(r).forEach(seg=>{
      if(!seg.format) return;
      const w=segWeight(seg);
      const isAgg=FORMATS[seg.format]?.scoring==='aggregate';
      const ms=segMatches(seg);
      if(ms.length){
        ms.forEach(m=>{
          const sp=isAgg ? aggPointSplit(computeAggregateMatch(r,seg,m)) : matchPointSplit(computeMatch(r,seg,m));
          if(!sp) return;
          const aT=teamOfSide(m.a), bT=teamOfSide(m.b);
          if(aT) pts[aT]=(pts[aT]||0)+sp.a*w;
          if(bT) pts[bT]=(pts[bT]||0)+sp.b*w;
        });
      } else if(isAgg){
        const tn=segTeamNet(r,seg); const entries=Object.entries(tn).filter(([,v])=>v.played);
        if(entries.length<2) return;
        entries.sort((a,b)=>a[1].net-b[1].net);
        if(entries[0][1].net===entries[1][1].net){ entries.forEach(([id])=>pts[id]+=0.5*w); }
        else pts[entries[0][0]]+=1*w;
      }
    });
  });
  return pts;
}
// count of scorable segments across the trip (for the "x of y" footer)
function liveSegCount(){ let n=0; (State.config.rounds||[]).filter(r=>!r.test).forEach(r=>segsOf(r).forEach(s=>{ if(s.format) n++; })); return n; }
function totalSegCount(){ let n=0; (State.config.rounds||[]).filter(r=>!r.test).forEach(r=>n+=segsOf(r).length); return n; }
const roundLive = (r)=> segsOf(r).some(s=>s.format);
const liveSegs = (r)=> segsOf(r).filter(s=>s.format);

let refreshInFlight=false, refreshQueued=false;
async function refresh(){
  if(State.demo) return;   // frozen preview — don't overwrite with live data
  if(refreshInFlight){ refreshQueued=true; return; }   // never run overlapping polls — one more pass happens right after this one finishes
  refreshInFlight=true;
  try{
    await Store.flush();                 // retry any queued writes first
    const avs=await Store.list('avatar:');
    State.avatars={}; Object.entries(avs).forEach(([k,v])=>{ State.avatars[k.split(':')[1]]=v?.emoji; });
    const hs=await Store.list('hcp:');
    State.hcps={}; Object.entries(hs).forEach(([k,v])=>{ if(v?.index!=null) State.hcps[k.split(':')[1]]=v.index; });
    const vs=await Store.list('vote:');
    State.votes={}; Object.entries(vs).forEach(([k,v])=>{ const a=Array.isArray(v?.choices)?v.choices.filter(Boolean):(v?.choice?[v.choice]:[]); if(a.length) State.votes[k.split(':')[1]]=a; });
    const rx=await Store.list('react:');
    State.reactions={}; Object.entries(rx).forEach(([k,v])=>{ if(v?.map) State.reactions[k.split(':')[1]]=v.map; });
    const ti=await Store.list('title:');
    State.titles={}; Object.entries(ti).forEach(([k,v])=>{ if(v?.text) State.titles[k.split(':')[1]]=v.text; });
    const freshCards=await Store.list('card:');
    const now=Date.now();
    const merged={...State.cards};
    Object.keys(freshCards).forEach(k=>{
      const fresh=freshCards[k], local=merged[k];
      const protectedUntil=recentLocalWrite.get(k);
      const stillProtected = protectedUntil && now<protectedUntil;
      if(!local || !stillProtected){ merged[k]=fresh; return; }   // no recent edit here — trust the server (picks up other devices' corrections)
      // recently edited on THIS device — union the holes, local wins, so a poll can't erase something just entered
      merged[k] = { ...fresh, ...local, holes: {...(fresh.holes||{}), ...(local.holes||{})} };
    });
    for(const [k,t] of recentLocalWrite){ if(now>=t) recentLocalWrite.delete(k); }   // housekeeping
    State.cards=merged;
    const cfg=await Store.get('config'); if(cfg){ State.config=cfg; }
    updateSyncDot(Store.status());
    if(State.view==='board') updateBoard();
    else if(State.view==='enter'){ const {round,seg,key}=curEntryRefs(); updateEntryAfterSave(State.cards[key]||{holes:{},enteredBy:''}); }
    else if(State.view==='roster' && getDraft().status==='live') render(false);
  }catch(e){}
  finally{
    refreshInFlight=false;
    if(refreshQueued){ refreshQueued=false; refresh(); }
  }
}

function startPoll(){ clearInterval(pollTimer); pollTimer=setInterval(refresh, 5000); }

// Individual net leaderboard for a round (aggregates that round's individual-ball segments)
function playerBoard(round){
  const c=courseOf(round), pars=c?.pars||[];
  const stats={};
  segsOf(round).forEach(seg=>{
    if(!seg.format || FORMATS[seg.format]?.side==='group') return; // skip scramble
    (State.config.players||[]).forEach(p=>{
      const card=State.cards[cardKey(round.id,seg.id,p.id)];
      const g=grossTotal(card); if(g==null) return;
      const n=netForCard(p.id,card,false,round,seg.format);
      const s=stats[p.id]||(stats[p.id]={gross:0,net:0,thru:0,parPlayed:0});
      s.gross+=g; s.net+=(n==null?g:n); s.thru+=holesPlayed(card);
      Object.keys(card.holes).forEach(h=>{ if(card.holes[h]!=null) s.parPlayed+=pars[h-1]||0; });
    });
  });
  const rows=Object.entries(stats).map(([pid,s])=>({pid,...s})).sort((a,b)=>a.net-b.net);
  if(!rows.length){
    return `<div class="card"><div class="empty"><div class="big">🏌️</div><b>No individual scores yet</b><p class="muted" style="margin-top:6px">Singles, better ball, and shramble show up here. Scramble is team-only.</p></div></div>`;
  }
  const body=rows.map((r,i)=>{
    const p=player(r.pid), t=team(p?.teamId);
    const relN=Math.round(r.gross-r.parPlayed);
    const cls=relN<0?'under':relN>0?'over':'even';
    const relTxt=relN===0?'E':(relN>0?'+'+relN:relN);
    return `<div class="row">
      <div style="width:18px;text-align:center;font-family:'Oswald';font-weight:700;color:var(--text-dim)">${i+1}</div>
      <div class="teamdot" style="background:${t?.color||'#999'}"></div>

      <div class="rel ${cls}">${relTxt}</div>
      <div class="sc">${Math.round(r.net)}</div>
    </div>`;
  }).join('');
  return `<div class="card"><div class="eyebrow" style="color:var(--gold)">${esc(round.name)} · Individual ${useHcp()?'net':'gross'}</div>${body}
    <div class="muted" style="margin-top:10px;font-size:11px">${useHcp()?'Net shown big, gross in the line below':'Gross shown'} · score-to-par at right · lowest wins.</div></div>`;
}

function teamTotalBoard(round,seg){
  const c=courseOf(round);
  const head=`<div class="eyebrow" style="color:var(--gold)">${esc(round.name)}${round.split?' · '+esc(seg.label):''} · Team Total${fmtInfo('teamtotal')} · ${esc(c?.name||'Course TBD')}</div>`;
  const ms=segMatches(seg);
  if(ms.length){
    const [TA,TB]=State.config.teams;
    const matchHead=`<div class="match-head"><span style="color:${TA.color}">${esc(TA.name)}</span><span></span><span style="color:${TB.color}">${esc(TB.name)}</span></div>`;
    const avs=(ids)=>`<span class="mav">${ids.map(id=>avatarOf(id)).join('')}</span>`;
    const nms=(ids)=>`<span class="mnames">${ids.map(id=>`<span>${esc(displayName(id))}</span>`).join('')}</span>`;
    const rows=ms.map(m=>{
      const agg=computeAggregateMatch(round,seg,m);
      const aIsLeft=teamOfSide(m.a)===TA.id;
      const left=aIsLeft?m.a:m.b, right=aIsLeft?m.b:m.a;
      const leftTotal=aIsLeft?agg.aTotal:agg.bTotal, rightTotal=aIsLeft?agg.bTotal:agg.aTotal;
      const haveBoth = leftTotal!=null && rightTotal!=null;
      const leftLead = haveBoth && leftTotal<rightTotal;
      const rightLead = haveBoth && rightTotal<leftTotal;
      const statusMain = haveBoth ? `${Math.round(leftTotal)} – ${Math.round(rightTotal)}` : '—';
      const statusSub = agg.thru>0 ? (agg.final?'final':`thru ${agg.thru}`) : '';
      return `<div class="matchwrap"><div class="match">
        <div class="mside ${leftLead?'win':''}" style="--tc:${TA.color};${leftLead?'background:'+tint(TA.color,.2):''}">${avs(left)}${nms(left)}</div>
        <div class="mstatus"><b>${statusMain}</b>${statusSub?`<span class="ssub">${esc(statusSub)}</span>`:''}</div>
        <div class="mside b ${rightLead?'win':''}" style="--tc:${TB.color};${rightLead?'background:'+tint(TB.color,.2):''}">${nms(right)}${avs(right)}</div>
      </div></div>`;
    }).join('');
    return `<div class="card">${head}${matchHead}${rows}
      <div class="muted" style="margin-top:8px;font-size:11px">Each tee-time group's combined net decides that group's point — lower total wins the group.</div>
    </div>`;
  }
  // fallback: no pairings set yet — compare the two whole teams (old behavior)
  const tn=segTeamNet(round,seg);
  const teams=(State.config.teams||[]).map(t=>({t, net:tn[t.id]?.net, played:tn[t.id]?.played}));
  const playedTeams=teams.filter(x=>x.played);
  const low=playedTeams.length?Math.min(...playedTeams.map(x=>x.net)):null;
  const rows=teams.map(x=>{
    const lead = x.played && low!=null && x.net===low && playedTeams.length>1;
    return `<div class="row">
      <div class="teamdot" style="background:${x.t.color}"></div>
      <div class="nm"><b style="${lead?'color:'+x.t.color:''}">${esc(x.t.name)}</b><span>${x.played?'combined net':'no scores yet'}</span></div>
      <div class="sc">${x.played?Math.round(x.net):'—'}</div>
    </div>`;
  }).join('');
  return `<div class="card">${head}${rows}
    <div class="muted" style="margin-top:8px;font-size:11px">No tee-time pairings set — comparing the two teams' full combined net. Add pairings in Admin to score it by group instead.</div>
  </div>`;
}
function segMatchBoard(round,seg){
  const c=courseOf(round);
  const [TA,TB]=State.config.teams;
  const head=`<div class="eyebrow" style="color:var(--gold)">${esc(round.name)}${round.split?' · '+esc(seg.label):''} · ${FORMATS[seg.format]?.label||'Format TBD'}${fmtInfo(seg.format)} · ${esc(c?.name||'Course TBD')}</div>`;
  const matchHead=`<div class="match-head"><span style="color:${TA.color}">${esc(TA.name)}</span><span></span><span style="color:${TB.color}">${esc(TB.name)}</span></div>`;
  const avs=(ids)=>`<span class="mav">${ids.map(id=>avatarOf(id)).join('')}</span>`;
  const nms=(ids)=>`<span class="mnames">${ids.map(id=>`<span>${esc(displayName(id))}</span>`).join('')}</span>`;
  const rows=segMatches(seg).map(m=>{
    const res=computeMatch(round,seg,m);
    const aIsLeft = teamOfSide(m.a)===TA.id;        // keep Team A always on the left
    const left = aIsLeft ? m.a : m.b;
    const right = aIsLeft ? m.b : m.a;
    const leftUp  = res.played>0 && (aIsLeft ? res.diff>0 : res.diff<0);
    const rightUp = res.played>0 && (aIsLeft ? res.diff<0 : res.diff>0);
    const statusTxt = res.played===0 ? '—' : matchStatusText(res);
    const sp=matchStatusParts(res);
    const mk=matchKeyOf(round.id, seg.id, m.id);
    return `<div class="matchwrap"><div class="match">
      <div class="mside ${leftUp?'win':''}" style="--tc:${TA.color};${leftUp?'background:'+tint(TA.color,.2):''}">${avs(left)}${nms(left)}</div>
      <div class="mstatus">${res.played===0?'<span class="pre">—</span>':`<b>${esc(sp.main)}</b>${sp.sub?`<span class="ssub">${esc(sp.sub)}</span>`:''}`}</div>
      <div class="mside b ${rightUp?'win':''}" style="--tc:${TB.color};${rightUp?'background:'+tint(TB.color,.2):''}">${nms(right)}${avs(right)}</div>
    </div>${reactionBarHTML(mk)}</div>`;
  }).join('');
  return `<div class="card">${head}${rows?matchHead+rows:'<div class="muted">No matches set for this segment.</div>'}
    <div class="muted" style="margin-top:8px;font-size:11px">The highlighted side is up. "AS" = all square · "2 UP · thru 5" = 2 holes ahead through 5 · "3&2" = won by 3 with 2 to play.</div>
  </div>`;
}
function segLeaderboard(round,seg){
  const isGroup=FORMATS[seg.format]?.side==='group';
  const c=courseOf(round), pars=c?.pars||[];
  const sides=sidesForSeg(round,seg).map(s=>{
    const card=State.cards[cardKey(round.id,seg.id,s.id)];
    return {s,card,gross:grossTotal(card),net:netForCard(s.id,card,isGroup,round,seg.format),thru:holesPlayed(card)};
  }).filter(x=>x.gross!=null);
  sides.sort((a,b)=>(a.net??999)-(b.net??999));
  const segName = round.split ? seg.label : `${round.name}`;
  const head=`<div class="eyebrow" style="color:var(--gold)">${esc(round.name)}${round.split?' · '+esc(seg.label):''} · ${FORMATS[seg.format]?.label||'Format TBD'}${fmtInfo(seg.format)} · ${esc(c?.name||'Course TBD')}</div>`;
  if(!sides.length){
    return `<div class="card">${head}<div class="empty" style="padding:16px"><div class="big">⛳</div><p class="muted" style="margin-top:4px">No scores in yet.</p></div></div>`;
  }
  const rows=sides.map((x)=>{
    const t=team(x.s.teamId);
    // score to par over the holes actually played within this segment
    let parPlayed=0; if(x.card?.holes){ Object.keys(x.card.holes).forEach(h=>{ if(x.card.holes[h]!=null) parPlayed+=pars[h-1]||0; }); }
    const relN=Math.round((x.gross||0)-parPlayed);
    const cls=relN<0?'under':relN>0?'over':'even';
    const relTxt=relN===0?'E':(relN>0?'+'+relN:relN);
    const idx=x.s.kind==='player'?hcpOf(x.s.id):null;
    return `<div class="row">
      <div class="teamdot" style="background:${t?.color||'#999'}"></div>
      <div class="av" style="border-color:${t?.color||'transparent'}">${sideAvatar(x.s)}</div>
      <div class="nm"><b>${esc(sideLabel(x.s))}</b><span>Thru ${x.thru}${isGroup?'':' · Idx '+(idx!=null?idx:'—')}</span></div>
      <div class="rel ${cls}">${relTxt}</div>
      <div class="sc">${x.net!=null?Math.round(x.net):'—'}</div>
    </div>`;
  }).join('');
  return `<div class="card">${head}${rows}
    <div class="muted" style="margin-top:10px;font-size:11px">Net shown big · score-to-par at right. Group formats show gross.</div>
  </div>`;
}

  ${sideTabs}

    <div class="mono" id="entryTotal" style="text-align:center;font-size:11px;color:var(--text-dim);margin-bottom:10px">${entryTotalHTML(card,round,seg,side.id)}</div>
    ${tableHTML}

      <div class="val" id="strokeVal">${cur??par}<small>Strokes · Hole ${State.entryHole}</small></div>
      <button class="pm" id="plus">+</button>
    </div>

    <div id="syncNote" style="display:none;text-align:center;font-size:11px;color:#9a7a10;margin-top:6px"></div>
  </div>
  `;

function prevHole(){

function selectCell(hole, pid){

function wireEntry(){
  const {round,seg}=curEntryRefs();
  const c=courseOf(round); const par=(c?.pars?.[State.entryHole-1])||4;
  const plus=$('#plus'), minus=$('#minus');
  const curVal=()=>{ const {key}=curEntryRefs(); return State.cards[key]?.holes?.[State.entryHole]; };
  if(plus) plus.onclick=()=>{ const v=Math.min(15,(curVal()??par)+1); saveHole(v); };
  if(minus) minus.onclick=()=>{ const v=Math.max(1,(curVal()??par)-1); saveHole(v); };
  window.setStroke=(v)=>{ saveHole(v); };
  window.clearHole=()=>{ saveHole(null); };
  const selCell=document.getElementById('hole-'+State.entryHole+'-'+State.entrySide);
  if(selCell && typeof selCell.scrollIntoView==='function') selCell.scrollIntoView({inline:'center', block:'nearest'});

const recentLocalWrite=new Map();   // storage key -> timestamp until which local data should win over a poll fetch
async function saveHole(v){
  const {round,key}=curEntryRefs();
  if(round?.frozen) return; // locked
  const card=State.cards[key] || {holes:{}, enteredBy:'', updatedAt:0};
  if(!card.holes) card.holes={};
  if(v==null) delete card.holes[State.entryHole]; else card.holes[State.entryHole]=v;
  card.enteredBy=player(State.me)?.name||'—';
  card.updatedAt=Date.now();
  State.cards[key]=card;
  recentLocalWrite.set(key, Date.now()+20000);   // protect this key's local data for 20s — covers any sync lag without permanently ignoring other devices' updates
  if(State.view==='enter') updateEntryAfterSave(card);   // paint the row/total instantly
  Store.set(key,card);   // fires immediately — Store's own outbox protects this from a same-moment poll; syncs to Netlify in the background
}

function updateEntryAfterSave(card){

/* ============================================================

   full breakdown is admin-only and can seed the draft)

function myVotes(){ return (State.me && State.votes[State.me]) ? State.votes[State.me] : []; }
function voteTally(){ const t={}; Object.values(State.votes).forEach(arr=>{ (arr||[]).forEach(c=>{ if(c) t[c]=(t[c]||0)+1; }); }); return t; }
function voteTopN(n){ return Object.entries(voteTally()).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([id])=>id); }
function voteCount(){ return Object.keys(State.votes).filter(k=>(State.votes[k]||[]).length>0).length; }
function toggleVote(choiceId){
  if(!State.me) return;
  let cur=(State.votes[State.me]||[]).slice();
  if(cur.includes(choiceId)) cur=cur.filter(x=>x!==choiceId);
  else { if(cur.length>=2) return; cur.push(choiceId); }
  State.votes[State.me]=cur;
  updateVoteRows();   // mutate the existing buttons in place — don't tear down/rebuild the DOM the finger just tapped
  Store.set('vote:'+State.me,{choices:cur, at:Date.now()});   // syncs in the background; queues + retries if offline
}
function voteRowInner(p, on){
  return `<span class="vbox ${on?'on':''}">${on?'✓':''}</span>
    <span style="width:26px;height:26px;border-radius:50%;background:var(--paper2);display:grid;place-items:center;font-size:15px;flex:none">${avatarOf(p.id)}</span>
    <span style="flex:1">${esc(p.name)}</span>`;
}
function updateVoteRows(){
